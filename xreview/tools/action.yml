name: sei-droid xreview
description: Drive one managed sei-droid omnigent session over a PR and post a single verdict.

inputs:
  repo:
    required: true
    description: owner/name of the PR's repository.
  pr_number:
    required: true
    description: PR number to review.
  dry_run:
    required: true
    description: >-
      'true' means the driver posts nothing and writes the verdict to the job
      summary. This governs the DRIVER's posting only; the agent is separately
      instructed not to post (see the README security posture). Fail-closed:
      any value other than the exact string 'false' runs dry.
  github_token:
    required: true
    description: Token used to upsert the verdict comment (the caller's GITHUB_TOKEN).
  trigger_id:
    required: false
    default: ''
    description: >-
      Opaque per-trigger id (e.g. the triggering comment id) used as the
      driver's idempotency / run key, so a re-delivered event adopts the same
      session instead of driving a fresh turn, and two distinct triggers are
      two distinct runs. Defaults to a per-PR key when empty.
  omnigent_base_url:
    required: false
    default: http://omnigent.seigent.svc.cluster.local
    description: In-cluster omnigent Service. Override only for an out-of-cluster runner.

runs:
  using: composite
  steps:
    - name: Set up driver runtime
      id: runtime
      shell: bash
      run: |
        set -euo pipefail
        # Generic runner image: python3 is expected but not guaranteed, so
        # fail loudly rather than let a later step die opaquely. A pinned
        # venv keeps the httpx version deterministic regardless of the image.
        command -v python3 >/dev/null 2>&1 || { echo "python3 not found on runner" >&2; exit 1; }
        venv="$RUNNER_TEMP/seidroid-venv"
        python3 -m venv "$venv"
        "$venv/bin/python" -m pip install --disable-pip-version-check --no-input --quiet "httpx==0.27.2"
        echo "python=$venv/bin/python" >> "$GITHUB_OUTPUT"

    - name: Mint omnigent bearer (client_credentials)
      id: token
      shell: bash
      env:
        BASE_URL: ${{ inputs.omnigent_base_url }}
      run: |
        set -euo pipefail
        # OMNIGENT_M2M_CLIENT_SECRET is injected by the caller from a GitHub
        # Actions secret (masked in all logs). Fed to curl via a config read
        # from stdin so neither the id nor the secret lands in any argv.
        client_id="${OMNIGENT_M2M_CLIENT_ID:-sei-droid}"
        : "${OMNIGENT_M2M_CLIENT_SECRET:?OMNIGENT_M2M_CLIENT_SECRET not provided by the caller}"
        resp="$(curl -sS -w $'\n%{http_code}' \
          --config <(printf 'user = "%s:%s"\n' "$client_id" "$OMNIGENT_M2M_CLIENT_SECRET") \
          -d grant_type=client_credentials \
          "$BASE_URL/oauth/token")" || { echo "omnigent /oauth/token request failed" >&2; exit 1; }
        code="${resp##*$'\n'}"
        body="${resp%$'\n'*}"
        if [ "$code" != "200" ]; then
          echo "omnigent /oauth/token returned HTTP $code (expected 200)" >&2
          exit 1
        fi
        token="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token") or "")')"
        if [ -z "$token" ]; then
          echo "omnigent /oauth/token response carried no access_token" >&2
          exit 1
        fi
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Drive session + collect verdict
      id: drive
      shell: bash
      env:
        DRIVER_PYTHON: ${{ steps.runtime.outputs.python }}
        OMNIGENT_BASE_URL: ${{ inputs.omnigent_base_url }}
        OMNIGENT_API_TOKEN: ${{ steps.token.outputs.token }}
        DRY_RUN: ${{ inputs.dry_run }}
        REPO: ${{ inputs.repo }}
        PR: ${{ inputs.pr_number }}
        TRIGGER_ID: ${{ inputs.trigger_id }}
      run: |
        set -euo pipefail
        # Create exactly ONE managed sei-droid session, drive it, write the
        # verdict to verdict.md (ONLY when a real verdict is produced — the
        # driver writes no placeholder), and DELETE the session on exit AND on
        # SIGTERM/SIGINT so a cancelled run leaves no live session. State
        # lives under RUNNER_TEMP (the generic runner has no /var/lib write).
        # Fail-closed: anything other than the exact opt-in 'false' runs dry.
        # --trigger-id scopes the run key to this trigger (the comment id) so a
        # re-fire adopts rather than resurrects; omitted -> a per-PR key.
        args=("$REPO" "$PR" --out verdict.md)
        if [ "$DRY_RUN" != "false" ]; then args+=(--dry-run); fi
        if [ -n "${TRIGGER_ID:-}" ]; then args+=(--trigger-id "$TRIGGER_ID"); fi
        set +e
        PYTHONPATH="$GITHUB_ACTION_PATH/.." \
        XREVIEW_STATE_DIR="$RUNNER_TEMP/seidroid-state" \
          "$DRIVER_PYTHON" -m driver "${args[@]}"
        rc=$?
        set -e
        # Downstream gates on whether a verdict was PRODUCED (verdict.md
        # non-empty), not on the exit code: a teardown-only failure (verdict
        # produced, DELETE failed) still publishes, and a no-verdict run
        # (NO_VERDICT/TIMEOUT/TURN_FAILED) never posts a placeholder.
        if [ -s verdict.md ]; then
          echo "verdict_produced=true" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::driver exited $rc but produced a verdict (e.g. a teardown leak); see logs"
          fi
        else
          echo "verdict_produced=false" >> "$GITHUB_OUTPUT"
          echo "::error::driver produced no verdict (exit $rc)"
          exit "$rc"
        fi

    - name: Post verdict (sticky upsert)
      # Post ONLY in real-post mode AND only when a real verdict was produced
      # (drive step's verdict_produced). Keying on verdict_produced, not the
      # exit code, so a teardown-only failure still posts a valid verdict and a
      # no-verdict run never upserts a placeholder over a prior good comment.
      if: ${{ inputs.dry_run == 'false' && steps.drive.outputs.verdict_produced == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        MARKER: "<!-- seidroid-xreview -->"
        REPO: ${{ inputs.repo }}
        PR: ${{ inputs.pr_number }}
      run: |
        set -euo pipefail
        body="$MARKER"$'\n'"$(cat verdict.md)"
        # One bot comment per PR: find by marker -> PATCH, else POST. repo/pr are
        # read from env (not template-interpolated into the script). Structurally
        # prevents a double-post regardless of how the run was triggered.
        id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty")"
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
        fi

    - name: Dry-run summary (posts nothing)
      # Surface the outcome for every non-real-post run, including a non-zero
      # driver exit (NO_VERDICT/TIMEOUT still write verdict.md) — but not on
      # cancellation. Falls back to a note if the run failed before writing one.
      if: ${{ !cancelled() && inputs.dry_run != 'false' }}
      shell: bash
      run: |
        { echo "## sei-droid xreview (dry-run, not posted)"; echo; \
          cat verdict.md 2>/dev/null || echo "_(no verdict produced — the run failed before writing one; see the Drive step logs)_"; \
        } >> "$GITHUB_STEP_SUMMARY"
