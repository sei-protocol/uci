# Tooling config for the xreview driver — a small package that is run, not
# distributed. Pinning the ruff rule-set + line length keeps `ruff format` from
# drifting between contributors and gives idiom review a declared profile to
# check against. Wire `ruff check` + `ruff format --check` into CI to enforce.
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# `ruff format` owns line width; E501 on the occasional un-splittable line (a
# long string literal or URL) is noise the formatter cannot fix.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The selftest bootstraps sys.path before importing the driver package, so its
# imports intentionally follow that setup (E402 is correct here, not a defect).
"driver/tests/selftest.py" = ["E402"]
