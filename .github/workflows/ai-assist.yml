name: AI Assistant
on:
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]
  pull_request_review:
    types: [ submitted ]
jobs:
  assistant:
    # See: https://github.com/sei-protocol/uci/releases/tag/v0.0.22
    uses: sei-protocol/uci/.github/workflows/ai-assistant.yml@a3e422db031508ff0b2adf2e66e5a2860a8858e2
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets: inherit
    with:
      # See: https://github.com/sei-protocol/uci/releases/tag/v0.0.22
      uci-ref: 4bd0b7826bdf7966c2bd899b8810a3aaaa52e80d
      allowed-team: 'sei-protocol/sei-core'
