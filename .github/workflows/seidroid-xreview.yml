name: seidroid xreview
run-name: UCI / seidroid xreview
# Reusable, comment-triggered agentic PR review — the third seidroid capability
# (see .github/seidroid/README.md). A thin caller in the reviewed repo wires the
# issue_comment trigger and calls this with `uses:` (template:
# .github/seidroid/xreview/tools/seidroid-xreview.yml). Flow: comment
# `seidroid xreview` on a PR -> trusted-commenter gate -> drive one managed sei-droid
# omnigent session over the PR -> post one sticky verdict -> tear the session down.
#
# The driver is fetched from sei-protocol/uci at `uci-ref` and run in-line, so a caller
# updates by bumping the pinned ref — it never copies the review logic.
on:
  workflow_call:
    inputs:
      uci-ref:
        description: "Ref of sei-protocol/uci to fetch the xreview driver from. Pin to your `uses:` ref."
        required: false
        type: string
        default: 'main'
      runs-on:
        description: "Runner label for the review job. Must reach omnigent in-cluster."
        required: false
        type: string
        default: 'uci-default'
      omnigent-base-url:
        description: "omnigent base URL. In-cluster ClusterIP Service by default."
        required: false
        type: string
        default: 'http://omnigent.seigent.svc.cluster.local'
    secrets:
      OMNIGENT_M2M_CLIENT_SECRET:
        description: "omnigent client-credentials secret used to mint the session bearer."
        required: true

permissions: {}

jobs:
  guard:
    # Cheap allowlist + command parse on a hosted runner, no secrets, before any
    # in-cluster work spins up. The author_association gate is the trust boundary:
    # only OWNER/MEMBER/COLLABORATOR can fire it -- an untrusted PR author cannot.
    name: Guard
    runs-on: ubuntu-latest
    permissions: {}
    if: >-
      ${{ github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) }}
    outputs:
      should_run: ${{ steps.parse.outputs.should_run }}
      pr_number: ${{ steps.parse.outputs.pr_number }}
      comment_id: ${{ steps.parse.outputs.comment_id }}
    steps:
      - id: parse
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          cmd="$(printf '%s' "$BODY" | tr -d '\r')"
          # Require a LINE reading exactly `seidroid xreview`. Anchoring the match to a
          # whole line is what keeps a comment that merely quotes or discusses the
          # command from triggering a review.
          cmdline="$(printf '%s\n' "$cmd" | grep -m1 -E '^[[:space:]]*seidroid[[:space:]]+xreview[[:space:]]*$' || true)"
          if [ -z "$cmdline" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          # The comment id becomes the driver's per-trigger run key, so a
          # re-delivered comment adopts the same session rather than driving a
          # new turn, and two distinct comments are two distinct runs.
          echo "comment_id=${{ github.event.comment.id }}" >> "$GITHUB_OUTPUT"

  xreview:
    name: Review
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    # Exactly one review per PR: a newer `seidroid xreview` cancels an in-flight one
    # (latest wins, never two posters); the driver traps cancellation and DELETEs its
    # session. Job-level so the group is entered only when a real command runs.
    concurrency:
      group: seidroid-xreview-${{ github.event.issue.number }}
      cancel-in-progress: true
    # The reviewed repo's runner label. Org ARC scale set by default, in-cluster, so it
    # reaches omnigent over the ClusterIP Service and mints its bearer there.
    runs-on: ${{ inputs.runs-on }}
    permissions:
      pull-requests: write   # upsert the one sticky verdict comment
      contents: read         # read PR metadata
    # Sourced from the caller's secret (via `secrets: inherit` or an explicit pass), so
    # it is masked in logs regardless of the channel.
    env:
      OMNIGENT_M2M_CLIENT_SECRET: ${{ secrets.OMNIGENT_M2M_CLIENT_SECRET }}
    steps:
      - name: Fetch the xreview driver
        # uci is public; the driver is fetched at the caller-pinned ref and run in-line,
        # so the caller never copies review logic — it bumps the ref to update.
        uses: actions/checkout@v7
        with:
          repository: sei-protocol/uci
          ref: ${{ inputs.uci-ref }}
          path: .uci
          sparse-checkout: .github/seidroid/xreview/driver
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up driver runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          # A pinned venv keeps the httpx version deterministic regardless of the image.
          command -v python3 >/dev/null 2>&1 || { echo "python3 not found on runner" >&2; exit 1; }
          venv="$RUNNER_TEMP/seidroid-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-input --quiet "httpx==0.27.2"
          echo "python=$venv/bin/python" >> "$GITHUB_OUTPUT"

      - name: Mint omnigent bearer (client_credentials)
        id: token
        shell: bash
        env:
          BASE_URL: ${{ inputs.omnigent-base-url }}
        run: |
          set -euo pipefail
          # OMNIGENT_M2M_CLIENT_SECRET (job env, masked) is fed to curl via a config
          # read from stdin so neither the id nor the secret lands in any argv.
          client_id="${OMNIGENT_M2M_CLIENT_ID:-sei-droid}"
          : "${OMNIGENT_M2M_CLIENT_SECRET:?OMNIGENT_M2M_CLIENT_SECRET not provided by the caller}"
          resp="$(curl -sS -w $'\n%{http_code}' \
            --config <(printf 'user = "%s:%s"\n' "$client_id" "$OMNIGENT_M2M_CLIENT_SECRET") \
            -d grant_type=client_credentials \
            "$BASE_URL/oauth/token")" || { echo "omnigent /oauth/token request failed" >&2; exit 1; }
          code="${resp##*$'\n'}"
          body="${resp%$'\n'*}"
          if [ "$code" != "200" ]; then
            echo "omnigent /oauth/token returned HTTP $code (expected 200)" >&2
            exit 1
          fi
          token="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token") or "")')"
          if [ -z "$token" ]; then
            echo "omnigent /oauth/token response carried no access_token" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Drive session + collect verdict
        id: drive
        shell: bash
        env:
          DRIVER_PYTHON: ${{ steps.runtime.outputs.python }}
          OMNIGENT_BASE_URL: ${{ inputs.omnigent-base-url }}
          OMNIGENT_API_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.guard.outputs.pr_number }}
          TRIGGER_ID: ${{ needs.guard.outputs.comment_id }}
          DRIVER_ROOT: ${{ github.workspace }}/.uci/.github/seidroid/xreview
        run: |
          set -euo pipefail
          # Create exactly ONE managed sei-droid session, drive it, write the verdict
          # to verdict.md ONLY on a real verdict (no placeholder), and DELETE the
          # session on exit AND on SIGTERM/SIGINT. Fail-closed: anything other than the
          # exact opt-in 'false' runs dry. --trigger-id scopes the run key to this
          # comment so a re-fire adopts rather than resurrects.
          args=("$REPO" "$PR" --out verdict.md)
          if [ -n "${TRIGGER_ID:-}" ]; then args+=(--trigger-id "$TRIGGER_ID"); fi
          set +e
          PYTHONPATH="$DRIVER_ROOT" XREVIEW_STATE_DIR="$RUNNER_TEMP/seidroid-state" \
            "$DRIVER_PYTHON" -m driver "${args[@]}"
          rc=$?
          set -e
          # Downstream gates on whether a verdict was PRODUCED (verdict.md non-empty),
          # not on the exit code: a teardown-only failure still publishes, and a
          # no-verdict run never posts a placeholder.
          if [ -s verdict.md ]; then
            echo "verdict_produced=true" >> "$GITHUB_OUTPUT"
            if [ "$rc" -ne 0 ]; then
              echo "::warning::driver exited $rc but produced a verdict (e.g. a teardown leak); see logs"
            fi
          else
            echo "verdict_produced=false" >> "$GITHUB_OUTPUT"
            echo "::error::driver produced no verdict (exit $rc)"
            exit "$rc"
          fi

      - name: Post verdict (sticky upsert)
        # Post only when a real verdict was produced. Keying on verdict_produced, not
        # the exit code, so a teardown-only failure still posts a valid verdict and a
        # no-verdict run never upserts a placeholder.
        if: ${{ steps.drive.outputs.verdict_produced == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: "<!-- seidroid-xreview -->"
          REPO: ${{ github.repository }}
          PR: ${{ needs.guard.outputs.pr_number }}
        run: |
          set -euo pipefail
          body="$MARKER"$'\n'"$(cat verdict.md)"
          # One bot comment per PR: find by marker -> PATCH, else POST. repo/pr from env,
          # not template-interpolated into the script.
          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty")"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi
