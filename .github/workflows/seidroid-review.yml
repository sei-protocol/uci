name: seidroid review
run-name: UCI / seidroid review / ${{ (github.event.issue.number || github.event.pull_request.number) && format('#{0}', github.event.issue.number || github.event.pull_request.number) || github.ref_name }}
# Reusable, comment-triggered agentic PR review, driven by the sei-agent-driver
# binary from sei-protocol/sei-internal-skills. That module is where the reviewer's
# logic and its prompt live; this file is the GitHub wiring around it, and the two
# are versioned separately -- `uses:` pins this file, and this file pins the binary
# through the `driver-version` default. A thin caller in the reviewed repo wires the
# triggers and calls this with `uses:`. Flow: comment `@seidroid review` on a pull
# request -> guard gate -> install and run the driver over one managed omnigent
# session -> post the verdict as a new comment, the findings it can place, and a
# check run.
#
# TWO PATHS, one review. An AUTOMATIC review runs on `pull_request` when the caller
# wires that trigger and passes `mode: review`. A MANUAL one runs when a person
# comments `@seidroid review`. Both spend model quota and hold a sandbox, so both are
# gated -- see the guard below: the automatic path refuses a draft and honours the
# skip-review label, and the manual path additionally checks who is asking.
#
# This file is the automation of record. It REPLACES `ai-review.yml` rather than
# running beside it; a repository that wires the automatic path here should retire
# that caller in the same change, or every pull request is reviewed twice.
#
# The driver is installed with `go install` at `driver-version`, which defaults to the
# release this file drives, so every caller that omits the input runs one driver and one
# conclusion vocabulary. The install step checks the binary it got against that contract
# and fails there, before the review spends quota or takes a sandbox. The session is
# keyed on the pull request and OUTLIVES the run, which is why `mode: close` exists:
# it is the only thing that reclaims a sandbox.
#
# What changed versus the Python driver's workflow, and why:
#   - No runtime dependency install of the reviewer itself. The binary comes from
#     `go install` against the module's committed go.sum, so no package-manager
#     step runs unpinned code on a runner that is about to hold a live credential.
#   - No curl mint step, and no bearer token ever appears in a step output.
#     The driver mints its own session bearer in-process from
#     OMNIGENT_MACHINE_CLIENT_ID + OMNIGENT_MACHINE_CLIENT_SECRET
#     (client_credentials). The secret is wired as JOB-level env on the
#     `review` job below, never as step-level env on a `uses:` step --
#     step-level env on a `uses:` step does not reach a composite action, and
#     that exact defect broke every real run of the original Python workflow.
#   - Every GitHub-supplied value (repo, PR number, comment id) is routed
#     through env vars and read as "$VAR" in shell -- never interpolated as
#     ${{ }} directly into a shell or jq command line, so a hostile PR title,
#     branch name or comment body cannot inject shell/jq syntax.
#   - The verdict file's ABSENCE means "no verdict to post", and no step writes a
#     placeholder into it. A review that reaches none still publishes, because a
#     pull request with no artifact on it reads as a review that never ran: the
#     driver writes a failing check run to the same path it writes the deciding
#     one, under the title `no verdict`, and a step of its own reports the run in
#     a comment. Exactly one comment
#     per review run either way. Neither takes a position on the pull request, and
#     neither clears an earlier one -- a review that produced nothing has no
#     position to state.
#   - The outcome is surfaced even when the driver exits non-zero. The
#     surfacing steps gate on whether a verdict was produced rather than on
#     the exit code, so a review that reached one still posts it whatever else
#     went wrong; `!cancelled()` rather than `success()` keeps that true while
#     still skipping a run superseded by a newer trigger.
#   - allow-tools is a workflow input, defaulting to Bash,Read because the
#     prompt's first step is a shell command and a declined prompt therefore
#     produces a turn that reports it could not read the diff. Its access
#     control is the trigger gate above, not the allowlist -- see
#     https://github.com/sei-protocol/sei-internal-skills/blob/main/sei-agent-driver/cmd/sei-agent-driver/README.md
on:
  workflow_call:
    inputs:
      mode:
        description: >-
          "review" (default) drives a review turn on the pull request's session,
          keeping the conversation so the next invocation can say what changed.
          "close" deletes that session instead — the end of the unit of work, and
          the only thing that reclaims its sandbox.
        required: false
        type: string
        default: 'review'
      driver-version:
        description: >-
          sei-agent-driver version to install. It names a revision of
          sei-protocol/sei-internal-skills, NOT of this repository: the driver is a
          nested module there and moving this file did not move it. Passing a uci sha
          here fails the install with an unknown revision.

          LEAVE IT UNSET. The default is the release this file drives, and it is what
          makes one conclusion mean one thing across callers: a gate written against
          `success` in one repository then reads the same in the next. Set it only to
          run AHEAD of the default, on a driver change that has shipped and this file
          has not yet taken.

          Forward only. The install step below refuses a driver older than the default,
          because the conclusion a review reaches for a given set of findings is
          specific to the driver that reached it. Pin backward in this repository,
          under review, rather than in a caller.

          The module is nested, so the repository carries path-prefixed tags
          (sei-agent-driver/vX.Y.Z) while `go install` takes the bare version. Pass
          `v0.14.0`; `sei-agent-driver/v0.14.0` is refused as a disallowed version
          string. A commit sha resolves to a pseudo-version.

          Verify a pin from an EMPTY module cache: a warm one is a false green, because
          it resolves a pin the proxy may never have served.
        required: false
        type: string
        default: 'v0.14.0'
      allowed-team:
        description: >-
          org/team-slug whose active members may ask for a review. Empty keeps the
          author-association check below as the only gate, which admits any
          collaborator on the repository the request was made in — set this to
          narrow that to a team.
        required: false
        type: string
        default: ''
      approve-on-success:
        description: >-
          Approve the pull request when the review concludes clean. Off by
          default: clearing a human review requirement is the repository's policy
          decision, not this file's, so a clean run stays silent until the
          repository has decided it may approve. A blocking conclusion requests
          changes either way.
        required: false
        type: boolean
        default: false
      skip-review-label:
        description: >-
          A label on the reviewed pull request that stops the review. Empty
          disables the check.
        required: false
        type: string
        default: 'ai: skip-review'
      guidelines-file:
        description: >-
          The repository's own review standards, read from the base branch and
          outranking the driver's checklist. Empty reads REVIEW.md, which is what
          ai-review reads and what these repositories keep. Checked before it
          reaches a command, so a name carrying a shell metacharacter, an absolute
          path or a parent reference falls back to the default.
        required: false
        type: string
        default: ''
      extra-instructions:
        description: >-
          Guidance this repository adds to every review, alongside the standards
          above. The one input the review does not treat as data: it comes from
          this workflow rather than from the pull request.
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: >-
          Cap on the review job. Keep it comfortably above the driver's own
          SEIDROID_RUN_DEADLINE_S: the driver reports a timeout and the reason it
          hit one, where the runner killing the job leaves an annotation saying
          only that the job was cancelled.
        required: false
        type: number
        default: 45
      runs-on:
        description: >-
          Runner label for the review job. Defaults to a GitHub-hosted runner,
          which pairs with the https base URL below: the two have to describe one
          topology. An in-cluster group instead would reach an internet-facing
          NLB from inside its own VPC, which does not hairpin, and would also
          queue forever on any repository not in that runner group.
        required: false
        type: string
        default: 'ubuntu-latest'
      omnigent-base-url:
        description: >-
          omnigent base URL. The https ingress by default. It cannot be the
          in-cluster ClusterIP Service, which is plain http on port 80: a
          credentialed client refuses to be built against it, and the token mint
          refuses to send the client secret over it.
        required: false
        type: string
        default: 'https://seigent.dev.platform.sei.io'
      agent-id:
        description: >-
          The agent NAME to resolve on the server, as SEIDROID_AGENT_ID. Deployment
          specific: the driver compiles a default, and a server that calls its agent
          something else makes that default unresolvable -- a live run against the dev
          deployment failed with `no agent named "seidroid" on this server`, which
          nothing in the caller could correct because this input did not exist.

          Empty leaves the driver's own default in place, so a deployment that matches
          it needs nothing here. There is no lookup by alias: the name must match what
          the server's agent bundle is called, exactly.

          A mismatch does not present as a configuration error. The name is a join key
          with the omnigent.ai/agent label the server stamps on the runner Pod and the
          admission policy that mounts the git credential from it, so a runner that
          does not match attracts no credential and the review reports that it could
          not read the repository.
        required: false
        type: string
        default: ''

      machine-client-id:
        description: "OMNIGENT_MACHINE_CLIENT_ID for the in-process client_credentials mint. Mirrors the server's own OMNIGENT_MACHINE_CLIENT_ID. Not secret on its own -- the id alone cannot mint a token."
        required: false
        type: string
        default: 'seidroid'
      scouts:
        description: >-
          Independent readings to gather before the review, as `name=agent`,
          comma-separated. Empty runs the review alone, which is what it did
          before scouts existed. Each scout reads the same pull request in its own
          session on its own agent bundle, seeing neither the review nor another
          scout; the review then verifies their claims against the diff and merges
          what holds. A scout naming the review's own agent is refused, as are two
          scouts sharing one — neither would be a second opinion. Passed to the driver as
          SEIDROID_SCOUTS.

          Set this on the CLOSE job too. Scouts hold sessions of their own, and
          close derives which to delete from this value: unset there, every scout
          sandbox is left running with nothing able to reclaim it.
        required: false
        type: string
        default: ''
      claude-model:
        description: >-
          Model to answer the review on, substituting for the one the agent's spec
          names. Empty leaves the spec's own, which is the default. Passed to the driver as
          SEIDROID_MODEL.

          The server forwards the value as-is and enumerates nothing, so an
          unrecognised name is not rejected here or at configuration time -- it
          fails at turn start, and the review is the thing that does not happen.

          It applies to the review's own agent only. A scout runs on another agent,
          so another harness and another provider, and it keeps its spec's model.
        required: false
        type: string
        default: ''
      allow-policies:
        description: >-
          Comma-separated policy_name values the driver's permission policy
          accepts automatically (see Policy.Decide in the driver's
          internal/driver/policy.go, in sei-protocol/sei-internal-skills).
          Prefer allow-tools: policy_name is claude_native_permission for
          every native prompt (measured), so any value here accepts every tool
          call rather than a class of them. Passed to the driver as
          SEIDROID_ALLOW_POLICIES.
        required: false
        type: string
        default: ''
      allow-tools:
        description: >-
          Comma-separated tool_name values to accept. This deployment does stamp
          tool_name (measured), so this is the allowlist to prefer: it
          discriminates per tool. Passed to the driver as
          SEIDROID_ALLOW_TOOLS.

          Defaults to `Bash,Read` because the review cannot happen without them.
          The prompt's first step is a `gh pr diff` command, so an empty allowlist
          does not yield a shallower review -- it yields a turn that reports it
          could not read the diff. The shell runs inside the agent's own sandbox
          against its own gh credentials, and the access control on it is the
          trigger: only a sei-protocol developer can write the line that starts a
          review.

          `Read` is measured, not assumed. A read inside the agent's working
          directory raises no prompt, so the staged diff needs no grant; a read
          outside one does, and a recorded run had exactly that refused and spent
          three extra tool calls recovering. The diff now stages into the working
          directory, so this grant is the belt to that braces.
        required: false
        type: string
        default: 'Bash,Read'
    secrets:
      OMNIGENT_MACHINE_CLIENT_SECRET:
        description: "omnigent machine-client secret, exchanged in-process for a session bearer. Mirrors the server's OMNIGENT_MACHINE_CLIENT_SECRET_HASH -- the server stores only a digest of this value. The one secret an operator must configure to use this workflow."
        required: true
      SEIDROID_APP_ID:
        description: >-
          seidroid GitHub App id. Optional: without it the review posts as the
          workflow's own identity, which is correct but reads as github-actions rather
          than the bot. That identity also may not clear a block the App left, so a
          repository that removes this credential after the App has recorded
          CHANGES_REQUESTED can leave every later clean run failing on the dismissal
          it cannot perform. Dismiss those reviews by hand when you remove it.
        required: false
      SEIDROID_APP_PRIVATE_KEY:
        description: "seidroid GitHub App private key, exchanged for an installation token scoped to the calling repository. Never written to an output; the action masks it."
        required: false

permissions: {}

jobs:
  guard:
    # Cheap allowlist + command parse on a hosted runner, no secrets, before any
    # in-cluster work spins up and before any credential is minted. The
    # author_association gate is the trust boundary: only OWNER/MEMBER/
    # COLLABORATOR can fire it -- an untrusted PR author cannot.
    #
    # Bots are excluded separately, because association does not exclude them: a
    # bot with write access to the calling repository carries MEMBER or
    # COLLABORATOR like anyone else. Without this, a bot that quotes the command
    # -- one of ours echoing an earlier comment, say -- starts a real review, and
    # a bot that echoes its own trigger does so repeatedly.
    name: Guard
    runs-on: ubuntu-latest
    # A step condition cannot read `secrets`, so its presence is tested here and
    # read back as `env` below — the same shape the review job uses.
    env:
      HAS_REVIEWER_IDENTITY: ${{ secrets.SEIDROID_APP_ID != '' }}
    # Set at all because the account default is six hours. The guard only reads
    # API state, so a minute is generous.
    timeout-minutes: 5
    permissions: {}
    # Runs for an automatic pull_request review, and for any comment-triggered
    # dispatch, review or close. For a comment it decides whether the commenter may
    # command this workflow at all; for an automatic review it decides whether the
    # pull request is in a state worth spending a sandbox on. Routing is the
    # caller's: it reads the body and passes the mode. A close arriving as a
    # pull_request event skips the guard, since GitHub's own event is the authority.
    #
    # The pull_request branch carries no author-association check, matching the path
    # this file replaces: the event is the push itself rather than a person's
    # command, and GitHub withholds this workflow's secrets from a fork pull request
    # regardless -- such a run fails the machine-client check below and reviews
    # nothing, rather than running an agent over unauthorised code.
    if: >-
      ${{ (github.event_name == 'pull_request' && inputs.mode == 'review') ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) }}
    outputs:
      should_run: ${{ steps.parse.outputs.should_run == 'true' && steps.admit.outputs.admit == 'true' }}
      pr_number: ${{ steps.parse.outputs.pr_number }}
      comment_id: ${{ steps.parse.outputs.comment_id }}
    steps:
      - id: parse
        # Every GitHub-supplied value (the comment body, the PR number, the
        # comment id) comes in through env and is read back as "$VAR" below --
        # never interpolated as ${{ }} directly into the shell script, even for
        # the two fields (issue number, comment id) that GitHub happens to
        # always populate with integers. Routing all three the same way means
        # there is one pattern to audit, not one safe-looking exception.
        env:
          BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # An automatic review has no comment to parse: the event IS the request, and
          # the job condition above has already established which event this is. It
          # reports the same outputs the command grammar below produces, so every
          # later step reads one shape and no step needs a second code path.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            {
              echo "should_run=true"
              echo "pr_number=$PR_NUMBER"
              echo "command=review"
              echo "comment_id="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cmd="$(printf '%s' "$BODY" | tr -d '\r')"
          # Require a LINE reading `@seidroid review`, optionally `close`, and nothing
          # else on it. Anchoring to a whole line is what keeps a comment that merely
          # quotes or discusses the command from triggering a review.
          #
          # The @ is optional so `@seidroid review` -- the documented form, and what
          # the mention actually notifies -- and a bare `seidroid review` both work.
          # Whole-line anchoring is what keeps that safe: a comment discussing the
          # command has other words on the line and does not match.
          cmdline="$(printf '%s\n' "$cmd" \
            | grep -m1 -E '^[[:space:]]*@?seidroid[[:space:]]+review([[:space:]]+close)?[[:space:]]*$' || true)"
          if [ -z "$cmdline" ]; then
            # A review runs only on the repository the pull request is on, so a
            # request that names a repository is named in this run's log. That is all
            # this does: an issue_comment run attaches to no pull request, so the
            # annotation reaches whoever opens the run and nobody else, and
            # ai-assistant.yml still answers the body conversationally, because its
            # reservation is the bare command alone. Both match ai-review, where the
            # target form was never a review command either.
            #
            # It earns its line by naming the reason in the one place a person
            # debugging "why did my request do nothing" will look.
            #
            # notice, not error, because a denied request is a notice throughout
            # ai-review: an unauthorised actor, an unlisted bot, a draft and an empty
            # team all deny at that level. error there is reserved for a caller that
            # wired the workflow wrongly.
            #
            # Matched on the same whole-line anchor the command grammar above uses,
            # so the refusal covers exactly the shapes that fall through it.
            #
            # Captured, and tested for emptiness, rather than read from a `grep -q`
            # exit status. -q stops at the first match, which leaves printf writing
            # into a closed pipe on a body larger than the pipe buffer; pipefail then
            # reads the SIGPIPE as a failed pipeline and the refusal is not written.
            # Measured: at 232 kB the -q form reports status 141 and stays silent.
            named_repo="$(printf '%s\n' "$cmd" \
              | grep -m1 -E '^[[:space:]]*@?seidroid[[:space:]]+review([[:space:]]+close)?[[:space:]]+[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*#[0-9]+[[:space:]]*$' || true)"
            if [ -n "$named_repo" ]; then
              echo "::notice::seidroid review takes no repository target; a review runs only on the repository the pull request is on"
            fi
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          # Which of the two was asked for. The caller routes on the body as well and
          # passes the mode, but the guard has to know too: a close is teardown, and
          # some checks below stop a review without having any business stopping a
          # reclaim.
          # Anchored on the word the grammar accepts, immediately after `review`,
          # rather than found anywhere on the line, so nothing that merely contains
          # "close" is read as teardown.
          if printf '%s' "$cmdline" \
            | grep -qE '^[[:space:]]*@?seidroid[[:space:]]+review[[:space:]]+close([[:space:]]|$)'; then
            echo "command=close" >> "$GITHUB_OUTPUT"
          else
            echo "command=review" >> "$GITHUB_OUTPUT"
          fi
          # The comment id is passed as --trigger-id, which only labels this
          # dispatch in the logs. The pull request, not the comment, is the
          # session key — so any dispatch adopts that PR's session and drives a
          # fresh review turn on the current tree.
          echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"

      # Only reached once the command itself parsed, so a comment that says
      # nothing does not mint a token or call the API.
      - name: Mint an identity to ask about the team and the labels
        id: identity
        if: ${{ steps.parse.outputs.should_run == 'true' && env.HAS_REVIEWER_IDENTITY == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.SEIDROID_APP_ID }}
          private-key: ${{ secrets.SEIDROID_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Both keys, together. `owner` on its own mints a token that reaches every
          # repository the installation is on; `repositories` holds it to this one.
          repositories: ${{ github.event.repository.name }}

      - name: Admit the request
        id: admit
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token }}
          ALLOWED_TEAM: ${{ inputs.allowed-team }}
          SKIP_LABEL: ${{ inputs.skip-review-label }}
          ACTOR: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.parse.outputs.pr_number }}
          PARSED: ${{ steps.parse.outputs.should_run }}
          COMMAND: ${{ steps.parse.outputs.command }}
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -uo pipefail
          deny() { echo "::notice::$1"; echo "admit=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$PARSED" != "true" ]; then
            echo "admit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A draft is not ready to be read, and on the automatic path every push to
          # one would otherwise spend a sandbox for a review nobody asked for. Read
          # from the event payload rather than the API, so it needs no identity and
          # cannot fail open when none is configured.
          #
          # The manual path skips this check on purpose: commenting `@seidroid review`
          # on a draft is a direct request, and refusing it would be surprising.
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$IS_DRAFT" = "true" ]; then
            deny "$REPO#$PR is a draft; not reviewing"
          fi

          # Membership is a security control, so it fails closed: asked for and
          # unanswerable means denied. The job condition has already required an
          # OWNER/MEMBER/COLLABORATOR association, which admits any collaborator on
          # the repository the request was made in; a team narrows that.
          #
          # It gates who may COMMAND a review, so it applies to the comment path only.
          # An automatic run has no commander: applying the team check there would
          # silently stop reviewing every pull request opened by anyone outside the
          # team, which is the opposite of what a caller sets this input for.
          if [ "$EVENT_NAME" != "pull_request" ] && [ -n "$ALLOWED_TEAM" ]; then
            case "$ALLOWED_TEAM" in
              */*) ;;
              *) deny "allowed-team is not org/team-slug; denying" ;;
            esac
            [ -n "${GH_TOKEN:-}" ] || deny "no identity to check ${ALLOWED_TEAM} with; denying"
            state="$(gh api "orgs/${ALLOWED_TEAM%%/*}/teams/${ALLOWED_TEAM##*/}/memberships/${ACTOR}"               --jq .state 2>/dev/null || true)"
            [ "$state" = "active" ] || deny "$ACTOR is not an active member of $ALLOWED_TEAM; denying"
          fi

          # The label is a convenience rather than a control, so it fails open: it
          # stops a review someone did not want, and being unable to read it must
          # not stop every review when no identity is configured.
          # ...and it stops a REVIEW, not a teardown. A pull request that gains the
          # label after a session exists must still be able to reclaim its sandbox,
          # and nothing else will: no lifetime cap, no sweep.
          if [ "$COMMAND" != "close" ] && [ -n "$SKIP_LABEL" ] && [ -n "${GH_TOKEN:-}" ]; then
            if gh api "repos/$REPO/pulls/$PR" --jq '.labels[].name' 2>/dev/null                  | grep -qxF "$SKIP_LABEL"; then
              deny "$REPO#$PR carries $SKIP_LABEL; not reviewing"
            fi
          fi

          echo "admit=true" >> "$GITHUB_OUTPUT"

      # Fail here rather than after the in-cluster job is scheduled. A caller that
      # forgot the secret is the most likely misconfiguration, and `required: true`
      # does not catch it: a caller passing an unset secret satisfies "provided"
      # with an empty string. Without this the driver would spin a runner, mint
      # nothing, and report a credential error several minutes later.
      #
      # Only ever tests emptiness -- the value is never echoed, compared against a
      # literal, or written to an output.
      - name: Require the machine-client secret
        if: steps.parse.outputs.should_run == 'true'
        env:
          SECRET_PRESENT: ${{ secrets.OMNIGENT_MACHINE_CLIENT_SECRET != '' }}
        run: |
          if [ "$SECRET_PRESENT" != "true" ]; then
            echo "::error::OMNIGENT_MACHINE_CLIENT_SECRET is not set on the calling repository; configure it as a repository or organization secret and pass it to this workflow" >&2
            exit 1
          fi

  review:
    name: Review
    needs: guard
    # A close arriving as a pull_request event needs no guard verdict — GitHub's own
    # event is the trigger — so it runs even though the guard was skipped. always()
    # is required: a skipped dependency would otherwise skip this too.
    #
    # A close asked for in a COMMENT is a different thing and does need one. It is a
    # person destroying a session, so it goes through the same team gate the review
    # does; the only ungated close is the one the platform itself reports.
    # !cancelled() rather than always(), and the guard's RESULT rather than only its
    # output. always() started this job when the guard had failed -- the secret check
    # is the last thing the guard does, so should_run is already set by then and the
    # fast-fail bought nothing -- and started it on a cancelled run, which spends
    # model quota and holds a sandbox for a review nobody is waiting for.
    #
    # !cancelled() is still needed because the close path SKIPS the guard, and a
    # skipped dependency would otherwise skip this too. Each path names the guard
    # result it expects, so neither admits the other's: a pull_request REVIEW is
    # guarded, because that is where draft and skip-label are decided, while a
    # pull_request CLOSE is not guarded at all.
    if: >-
      ${{ !cancelled() && (
      ((github.event_name == 'issue_comment' ||
        (github.event_name == 'pull_request' && inputs.mode == 'review')) &&
        needs.guard.result == 'success' &&
        needs.guard.outputs.should_run == 'true') ||
      (github.event_name == 'pull_request' &&
        inputs.mode == 'close' &&
        needs.guard.result == 'skipped')) }}
    # Exactly one review per PR: a newer `seidroid review` cancels an in-flight one
    # (latest wins, never two posters); the driver traps cancellation and STOPS its
    # session, keeping the conversation. Only the close event deletes it, so a rapid
    # re-trigger does not reclaim the sandbox. Job-level so the group is entered only
    # when a real command runs.
    concurrency:
      # The mode is in the group: without it a review dispatch and a close dispatch
      # for one pull request share a group under cancel-in-progress, so commenting on
      # a just-closed pull request cancels the in-flight close -- and close is the
      # only thing that reclaims a sandbox.
      #
      # The event's own number is the third term's fallback, and it is load-bearing:
      # a close arriving as a pull_request event skips the guard, so the guard's
      # number is empty there. Without it every reclaim run shares one group, and
      # two closes for different pull requests cancel each other -- while close is
      # the only thing that reclaims a sandbox.
      group: >-
        seidroid-review-${{ inputs.mode }}-${{ github.repository }}-${{ needs.guard.outputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: true
    # The reviewed repo's runner label, GitHub-hosted by default. The default pairs
    # with the https base URL: the mint refuses to send the client secret over plain
    # http, so the in-cluster ClusterIP Service is not a usable target however the
    # runner is hosted.
    runs-on: ${{ inputs.runs-on }}
    # The outer bound on a wedged review. Without it the account default is six
    # hours, and the managed sandbox stays up for the whole of it. Comfortably
    # above the driver's own SEIDROID_RUN_DEADLINE_S so the driver reports the
    # timeout, with its reason, before the runner kills the job.
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      pull-requests: write   # post the verdict comment and the review position
      contents: read         # read PR metadata
      checks: write          # publish the review check run
      # React to the triggering comment. A reaction on a PR comment goes to the
      # ISSUE comments endpoint, which pull-requests: write does not cover.
      issues: write          # acknowledge the trigger with a reaction
    # The credential lives ONLY here, at job level. It must never be re-declared
    # as step-level env on a `uses:` step (composite/action steps do not receive
    # step-level env at all) -- that is the exact defect that broke every real
    # run of the Python driver's workflow. Every step in this job inherits it.
    env:
      # Empty is not the same as unset for this one: an empty SEIDROID_AGENT_ID would
      # override the driver's default with nothing. envOr treats empty as absent, so
      # passing it through empty is safe and keeps one place deciding the default.
      SEIDROID_AGENT_ID: ${{ inputs.agent-id }}
      OMNIGENT_MACHINE_CLIENT_ID: ${{ inputs.machine-client-id }}
      OMNIGENT_MACHINE_CLIENT_SECRET: ${{ secrets.OMNIGENT_MACHINE_CLIENT_SECRET }}
      # Whether the bot's identity is available, as a value a step condition can
      # read. The secrets context is not one of those -- a step `if` that touches
      # it is a workflow-file error, not a false condition -- so the presence test
      # happens here, the same way the machine-client check below does it.
      HAS_REVIEWER_IDENTITY: ${{ secrets.SEIDROID_APP_ID != '' }}
    steps:
      # First, deliberately: the reaction is the only signal the trigger was
      # seen, and everything after it -- toolchain, driver install, session
      # start -- runs for minutes before anything else appears on the pull
      # request. An acknowledgement that arrives after the verdict is not one.
      #
      # Comment path only. An automatic pull_request review has no comment to
      # react to, so the guard leaves comment_id empty and this is skipped.
      #
      # continue-on-error: an acknowledgement is a courtesy. Failing the review
      # because a reaction did not post would trade the whole job for the
      # signal that the job started.
      - name: Acknowledge the trigger
        # A review turn, and a comment to react to. `Answer the request` withdraws this
        # reaction and it runs on the same two facts, so a mode it skips must not react
        # here: a close would leave eyes that nothing clears.
        if: ${{ inputs.mode == 'review' && needs.guard.outputs.comment_id != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TRIGGER_ID: ${{ needs.guard.outputs.comment_id }}
        run: |
          set -euo pipefail
          # Reactions are idempotent per (user, content): re-running a review on
          # the same comment returns the existing reaction rather than adding a
          # second one, so a retry needs no cleanup.
          #
          # `Answer the request` withdraws this reaction, on every path it takes. A
          # review that keeps it reads as a review that is still running.
          if gh api -X POST "repos/$REPO/issues/comments/$TRIGGER_ID/reactions" \
              -f content=eyes >/dev/null 2>&1; then
            echo "acknowledged comment $TRIGGER_ID"
          else
            echo "::warning::could not react to comment $TRIGGER_ID; the review continues"
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # At or above what the driver's own go.mod requires. A live run proved why
          # this cannot lag: pinned at 1.24 while the module declared go 1.25.0, the
          # install died with
          #   requires go >= 1.25.0 (running go 1.24.13; GOTOOLCHAIN=local)
          # because setup-go exports GOTOOLCHAIN=local, so the go command may not
          # fetch the toolchain the module asks for. The step that installs the driver
          # sets GOTOOLCHAIN=auto for that reason and would have recovered this on its
          # own -- but a version resolved here rather than downloaded there is one
          # fewer network dependency on the path, so both are set.
          #
          # go-version-file is not usable: this workflow checks nothing out, so there
          # is no go.mod on disk to read. Bump this when the driver's does.
          go-version: '1.25'

      - name: Install the review driver
        id: build
        shell: bash
        env:
          DRIVER_VERSION: ${{ inputs.driver-version }}
          # Read by the floor below, which a close is exempt from.
          MODE: ${{ inputs.mode }}
          # Overrides the GOTOOLCHAIN=local that setup-go exports, for the reason that
          # step gives above.
          GOTOOLCHAIN: auto
          # The oldest driver this file drives, and deliberately the same release as
          # the driver-version default: a caller may run ahead of that default, never
          # behind it. The conclusion a review reaches for a given set of findings is
          # specific to the driver that reached it -- v0.12.0 concludes `success` where
          # v0.11.0 concludes `neutral`, and v0.14.0 writes a `failure` check for a run
          # that reaches no verdict where v0.13.0 writes none. A merge gate keyed on one
          # of those is wrong for the others, so this file serves one and refuses the
          # rest.
          #
          # Move this with the driver-version default above: one value in two places,
          # and nothing enforces it. The two mistakes are not symmetric. Raising this
          # alone fails every caller that omits the input, at once and in the open.
          # Raising the default alone leaves a floor that goes on admitting a driver
          # this file no longer drives -- the drift the whole check exists to catch, and
          # the direction that says nothing while it happens.
          MIN_DRIVER_VERSION: 'v0.14.0'
        run: |
          set -euo pipefail
          # An input default applies only when the caller omits the key. A caller that
          # passes the key through from its own optional input sends an empty string,
          # which reaches go install as a bare trailing @. The floor is the default, so
          # falling back to it here keeps the two the same value by construction rather
          # than by the comment below asking.
          DRIVER_VERSION="${DRIVER_VERSION:-$MIN_DRIVER_VERSION}"

          # sei-internal-skills is public, so there is no credential and no
          # GOPRIVATE. The module path below is absolute and did not change when this
          # file moved: the driver stays there.
          #
          # The driver is a NESTED module. The repository carries path-prefixed tags
          # (sei-agent-driver/vX.Y.Z) and `go install` refuses one as a disallowed
          # version string; what it takes is the bare version, `v0.14.0`. A sha becomes
          # a pseudo-version.
          out="$RUNNER_TEMP/bin"
          GOBIN="$out" go install \
            "github.com/sei-protocol/sei-internal-skills/sei-agent-driver/cmd/sei-agent-driver@${DRIVER_VERSION}"
          bin="$out/sei-agent-driver"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

          # What go install resolved, read from the build info the toolchain stamped
          # rather than from the binary's own --version, so a driver that changed how
          # it reports itself still answers this. A sha pin reads here as the
          # pseudo-version it became, so the log names exactly what reviewed.
          version="$(go version -m "$bin" | awk '$1 == "mod" { print $3; exit }')"
          echo "installed sei-agent-driver $version"

          # THE CONTRACT CHECK. It fails here, before the driver holds a credential,
          # opens a session or spends model quota -- a driver this file cannot drive
          # should cost an install, not a review.
          #
          # Too old is the version floor above, and it is the review's alone. A close
          # reaches no conclusion: it deletes the session, and it is the only thing that
          # reclaims a sandbox, so holding it to the vocabulary would strand a live
          # sandbox behind a caller edit. A close runs on whatever the caller pinned.
          # The surface check below still covers it, and `--close` is the part of that
          # surface this path needs.
          #
          # A pseudo-version carries the tag it follows, so a sha sorts against the
          # floor the same way a release does, and semver puts a pre-release below its
          # own core version.
          at_least() {
            printf '%s\n%s\n' "$1" "$2" | awk '
              NR == 1 { split(substr($0, 2), got, /[-.+]/); pre = index($0, "-") > 0; next }
              { split(substr($0, 2), want, /[.]/)
                for (i = 1; i <= 3; i++) {
                  if (got[i] + 0 > want[i] + 0) { exit 0 }
                  if (got[i] + 0 < want[i] + 0) { exit 1 }
                }
                exit pre }'
          }
          if [ "$MODE" != "close" ] && ! at_least "$version" "$MIN_DRIVER_VERSION"; then
            echo "::error::driver contract: sei-agent-driver $version is older than $MIN_DRIVER_VERSION, and reaches a different conclusion for the same findings; drop driver-version from the caller to take this workflow's own default"
            exit 1
          fi

          # Too new, or simply not this driver: a renamed subcommand or a renamed flag
          # is a contract this file no longer speaks. `review --help` is the whole
          # surface this file drives and the only part of it a check can read without a
          # credential and without a session. What --help cannot see -- the SEIDROID_*
          # variable names and the check.json fields -- still fails at run time.
          if ! usage="$("$bin" review --help 2>&1)"; then
            echo "::error::driver contract: sei-agent-driver $version has no \`review\` subcommand, which this workflow invokes"
            exit 1
          fi
          # Every long flag the help names, wherever it sits on the line. Anchoring to
          # the start of the line reads only `  --out string`, and cobra prints a flag
          # that has a shorthand as `  -o, --out string` -- so adding a shorthand, which
          # takes nothing away, would report the flag as missing and fail every review.
          supported="$(printf '%s\n' "$usage" | grep -oE -- '--[a-z0-9-]+' \
            | sed 's/^/ /; s/$/ /' | tr -d '\n')"
          missing=""
          for flag in --out --findings-out --check-out --close --conversation-context \
                      --guidelines-file --extra-instructions --trigger-id; do
            case "$supported" in (*" $flag "*) ;; (*) missing="$missing $flag" ;; esac
          done
          if [ -n "$missing" ]; then
            echo "::error::driver contract: sei-agent-driver $version does not accept \`review\`$missing, which this workflow passes"
            exit 1
          fi

      - name: Mint the reviewing identity
        # A review is the bot's work, and the identity on it is what a reader
        # trusts, so the posting steps below prefer this token to the workflow's own.
        #
        # Optional on purpose. Without the app credentials every step below falls
        # back to the workflow's own token -- correct, just attributed to
        # github-actions rather than to the bot.
        id: identity
        # Minted before the review rather than after it: the step below reads the
        # threads this reviewer left last time, and that read needs the same identity
        # that wrote them. Gating on a verdict is no longer possible here and no
        # longer needed -- an unused token costs one API call, and every step that
        # consumes it still carries its own condition.
        if: ${{ inputs.mode == 'review' && !cancelled()
          && env.HAS_REVIEWER_IDENTITY == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.SEIDROID_APP_ID }}
          private-key: ${{ secrets.SEIDROID_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Both keys, together, for the reason the guard's mint states.
          repositories: ${{ github.event.repository.name }}

      - name: Read the threads this review left before
        id: threads
        # What this reviewer said last time, and what the author said back. Read
        # here rather than by the agent for the reason the diff is: a step the agent
        # must perform is a step it can skip, and prose the author controls should
        # not travel through a shell to get here.
        #
        # Its own threads only. ai-review posts under the same bot identity, so the
        # marker every inline comment carries is what tells the two apart.
        #
        # continue-on-error, and the driver reads an absent file as a first review:
        # a history that cannot be fetched must cost the recall, not the review.
        if: ${{ inputs.mode == 'review' && !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.guard.outputs.pr_number }}
          THREADS: ${{ runner.temp }}/review-prior-threads.json
        run: |
          set -euo pipefail
          echo "threads_path=$THREADS" >> "$GITHUB_OUTPUT"
          owner="${REPO%%/*}"; name="${REPO##*/}"
          # $owner and friends are GraphQL variables, so the query stays literal.
          # shellcheck disable=SC2016
          gh api graphql -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100) {
                    nodes {
                      isResolved
                      path
                      line
                      originalLine
                      comments(first: 20) { nodes { body author { login } } }
                    }
                  }
                }
              }
            }' -F owner="$owner" -F name="$name" -F number="$PR" > "$THREADS.raw"

          # line goes null once a thread is stale against the head commit, and
          # originalLine still says where it was written -- which is what makes a
          # thread on since-rewritten code readable rather than a finding at line 0.
          jq '[ .data.repository.pullRequest.reviewThreads.nodes[]
                | select((.comments.nodes[0].body // "") | contains("<!-- seidroid-review:finding -->"))
                | { file: (.path // ""),
                    line: (.line // .originalLine // 0),
                    body: ((.comments.nodes[0].body // "") | sub("<!-- seidroid-review:finding -->\n*"; "")),
                    replies: [ .comments.nodes[1:][] | "\(.author.login // "someone"): \(.body)" ],
                    resolved: .isResolved } ]' "$THREADS.raw" > "$THREADS"
          echo "carrying $(jq length "$THREADS") prior finding(s) into this review"

      - name: Record the commit under review
        id: head
        if: ${{ inputs.mode == 'review' && !cancelled() }}
        # Tolerated, because this is a step that improves publishing and must not be
        # able to prevent reviewing. Failing it hard would let a transient api error
        # abort a review that would otherwise have run, since the drive step that
        # follows carries no condition of its own. No publisher below reads the head
        # for itself. Each one states what it cannot do when this step produces
        # nothing.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.guard.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Resolved once, here, and read from this output by every publisher below.
          # Everything published later is published AGAINST a commit, and the review
          # takes minutes. A publisher that reads the head for itself reads it after
          # the review, so a push mid-review attaches this verdict -- and a green
          # check -- to code the driver never saw. Several such reads also disagree
          # with each other inside one run.
          #
          # This is the commit the driver is about to review, and the commit every
          # publisher names. A push during the review moves the pull request's head.
          # It does not move this.
          sha="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "reviewing $REPO#$PR at $sha"

      - name: Drive session + collect verdict
        id: drive
        shell: bash
        env:
          BIN: ${{ steps.build.outputs.bin }}
          OMNIGENT_BASE_URL: ${{ inputs.omnigent-base-url }}
          SEIDROID_SCOUTS: ${{ inputs.scouts }}
          SEIDROID_MODEL: ${{ inputs.claude-model }}
          SEIDROID_ALLOW_POLICIES: ${{ inputs.allow-policies }}
          SEIDROID_ALLOW_TOOLS: ${{ inputs.allow-tools }}
          MODE: ${{ inputs.mode }}
          # The reviewed pull request. The driver keys the session on this pair.
          REPO: ${{ github.repository }}
          # The guard supplies this for a review; a close event carries its own
          # number and skips the guard entirely.
          PR: ${{ needs.guard.outputs.pr_number || github.event.pull_request.number }}
          TRIGGER_ID: ${{ needs.guard.outputs.comment_id }}
          # The findings this reviewer left before, so it drops what the author has
          # addressed and keeps what the diff still shows. No token rides with it:
          # this step reaches GitHub through nothing, which is the boundary that
          # keeps the driver's credentials to omnigent alone.
          THREADS: ${{ steps.threads.outputs.threads_path }}
          GUIDELINES_FILE: ${{ inputs.guidelines-file }}
          EXTRA_INSTRUCTIONS: ${{ inputs.extra-instructions }}
        run: |
          set -euo pipefail
          # OMNIGENT_MACHINE_CLIENT_ID/SECRET are already in the job env (see
          # above) -- the driver mints its own bearer in-process from them and
          # that token never transits a workflow step output.
          #
          # The verdict is written to a directory this run owns and clears first,
          # never to the workspace. actions/checkout cleans .driver and nothing
          # else, so a workspace-relative verdict.md left by an earlier run --
          # attempt 2 of this one, or any run on a non-ephemeral self-hosted
          # runner, which is the steady state here -- satisfies the non-empty
          # check below and gets posted as this review.
          out_dir="$RUNNER_TEMP/review-out/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"
          verdict="$out_dir/verdict.md"
          echo "verdict_path=$verdict" >> "$GITHUB_OUTPUT"
          # Written only when the review has observations that name a file and a
          # line, so its absence means "summary only" rather than a failure.
          findings="$out_dir/findings.json"
          echo "findings_path=$findings" >> "$GITHUB_OUTPUT"
          # Written whenever the review reached a verdict, including a clean one:
          # a checks list with no review entry reads as a review that did not run.
          check="$out_dir/check.json"
          echo "check_path=$check" >> "$GITHUB_OUTPUT"

          if [ "$MODE" = "close" ]; then
            args=(review "$REPO" "$PR" --close)
          else
            args=(review "$REPO" "$PR" --out "$verdict" --findings-out "$findings"
                  --check-out "$check")
            # Absent when the read above failed, and the driver reads that as a
            # first review rather than an error.
            if [ -s "${THREADS:-}" ]; then args+=(--conversation-context "$THREADS"); fi
            # Passed only when set, so the driver's own defaults stay the one
            # place either is decided.
            if [ -n "${GUIDELINES_FILE:-}" ]; then
              args+=(--guidelines-file "$GUIDELINES_FILE")
            fi
            if [ -n "${EXTRA_INSTRUCTIONS:-}" ]; then
              args+=(--extra-instructions "$EXTRA_INSTRUCTIONS")
            fi
            if [ -n "${TRIGGER_ID:-}" ]; then args+=(--trigger-id "$TRIGGER_ID"); fi
          fi
          set +e
          "$BIN" "${args[@]}"
          rc=$?
          set -e
          # Downstream gates on whether a verdict was PRODUCED (verdict.md
          # non-empty), not on the exit code, so a review that reached one still
          # publishes whatever else failed, and a no-verdict run never posts a
          # placeholder.
          if [ "$MODE" = "close" ]; then
            # A close deletes a session; it has no verdict to produce, so the
            # check below does not apply to it. Its own failure is the exit code,
            # and it matters: this is the only thing that reclaims a sandbox, and
            # nothing downstream notices when it does not.
            echo "verdict_produced=false" >> "$GITHUB_OUTPUT"
            if [ "$rc" -ne 0 ]; then
              echo "::error::close failed (exit $rc) — the session and its sandbox are still running"
            fi
          elif [ -s "$verdict" ]; then
            echo "verdict_produced=true" >> "$GITHUB_OUTPUT"
            if [ "$rc" -ne 0 ]; then
              echo "::warning::review exited $rc but produced a verdict (e.g. a teardown leak); see logs"
            fi
          else
            echo "verdict_produced=false" >> "$GITHUB_OUTPUT"
            echo "::error::review produced no verdict (exit $rc)"
            # A review that produced nothing fails the job, whatever the driver
            # exited. An annotation on a green job is a review nobody knows did not
            # happen, and every step that reports one runs on !cancelled() rather
            # than on success. 5 is the driver's own code for this.
            if [ "$rc" -eq 0 ]; then rc=5; fi
          fi
          exit "$rc"

      - name: Place findings on the code
        id: place
        # Placement degrades in two steps rather than dropping a finding. The API
        # accepts a line only where the diff covers it, and a review that reads the
        # files around the diff -- which the prompt asks for, because a change can
        # be locally correct and globally wrong -- cites both lines outside the
        # hunks and files the pull request never touches. An uncovered line goes on
        # its file; an untouched file has nowhere to go and is named in the summary.
        # So the cost of a review that sees past the hunks is paid in placement,
        # not in lost findings.
        if: ${{ inputs.mode == 'review' && !cancelled()
          && steps.drive.outputs.verdict_produced == 'true' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.guard.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.head.outputs.sha }}
          FINDINGS: ${{ steps.drive.outputs.findings_path }}
          # Marks every inline comment as this tool's, so a reader can tell an
          # review note from ai-review's and a later run can find its own.
          MARKER: "<!-- seidroid-review:finding -->"
          # Findings that reached neither a line nor a file, collected for the
          # summary. Declared here so the step below can read it by output.
          NOTE: ${{ runner.temp }}/review-unplaced.md
        run: |
          set -euo pipefail
          echo "note_path=$NOTE" >> "$GITHUB_OUTPUT"
          : > "$NOTE"
          if [ ! -s "$FINDINGS" ]; then
            echo "no findings to place; the summary carries the review"
            # Zero, and not silence. Nothing was placed because there was nothing to
            # place, which is a number the summary can state. A step that was skipped
            # writes nothing at all, and the summary tells the two apart by that.
            { echo "on_line=0"; echo "on_file=0"; echo "unplaced=0"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The commit the review read, recorded before it started and used as
          # recorded. A comment on any other commit points at code the review never
          # saw, so the head is not read again here.
          #
          # Empty when that record failed. Both calls below need a commit id and the
          # API rejects an empty one, so no comment can reach the diff and every
          # finding takes the third rung of the ladder above: the summary. The reader
          # loses the placement, not the finding.
          head_sha="${REVIEWED_SHA:-}"
          if [ -z "$head_sha" ]; then
            echo "::warning::the reviewed commit was not recorded on $REPO#$PR; every finding goes to the summary instead of the diff"
          fi
          on_line=0 on_file=0 unplaced=0
          # The detail is base64 per record, not @tsv. Finding.Detail is raw model
          # prose with no line constraint on it, and @tsv escapes a newline, a tab or
          # a backslash into a literal \n, \t or \\ -- so a multi-line detail reached
          # the pull request showing its escape sequences instead of its text. The
          # four fields that cannot contain a tab stay plain.
          while IFS=$'\t' read -r path line side severity detail_b64; do
            [ -z "$path" ] && continue
            detail="$(printf '%s' "$detail_b64" | base64 --decode)"
            body="$MARKER"$'\n'"**${severity}** — ${detail}"
            # Guarded on the commit, not left to the API. Without one both calls
            # return 422, and asking twice per finding for that answer spends the
            # rate limit on a result already known before the loop.
            if [ -n "$head_sha" ]; then
              if gh api -X POST "repos/$REPO/pulls/$PR/comments" \
                   -f body="$body" -f commit_id="$head_sha" -f path="$path" \
                   -F line="$line" -f side="$side" >/dev/null 2>&1; then
                on_line=$((on_line+1))
                continue
              fi
              # The line is outside the hunks. The file can still be in the pull
              # request, and a comment on it reaches the reviewer in the file they
              # are already reading, so the cited line rides in the body instead.
              if gh api -X POST "repos/$REPO/pulls/$PR/comments" \
                   -f body="$body"$'\n\n'"_Cited at \`$path:$line\`, outside this diff's changed lines._" \
                   -f commit_id="$head_sha" -f path="$path" \
                   -f subject_type=file >/dev/null 2>&1; then
                on_file=$((on_file+1))
                continue
              fi
            fi
            # shellcheck disable=SC2016  # the backticks are markdown, not a substitution
            printf -- '- `%s:%s` (%s) — %s\n' "$path" "$line" "$severity" "$detail" >> "$NOTE"
            unplaced=$((unplaced+1))
          done < <(jq -r '.[] | [.file, .line, .side, .severity, (.detail | @base64)] | @tsv' "$FINDINGS")
          # Two headers, because the summary collects findings for two reasons and
          # only one of them is about the reader's code. With no commit to attach to,
          # a finding on a changed line lands here as well, and calling it an
          # observation off the changed lines tells the reader the wrong thing about
          # their own diff.
          if [ -s "$NOTE" ]; then
            if [ -n "$head_sha" ]; then
              header='**Observations off the changed lines.** These are about code this pull request does not touch, so there is nowhere in the diff to attach them:'
            else
              header='**Every finding is here.** The commit under review was not recorded, so none of these could be attached to a line of the diff:'
            fi
            { printf -- '---\n\n%s\n\n' "$header"
              cat "$NOTE"
            } > "$NOTE.tmp"
            mv "$NOTE.tmp" "$NOTE"
          fi
          # Here and at the early exit above, and nowhere between: the two points where
          # these are final. A run that dies in between leaves them unwritten, which is
          # the right answer there -- placement neither finished nor was skipped, so no
          # number it could publish would be true.
          #
          # One append for all three, so the summary never reads a half-written set. It
          # requires all three for that reason, including the one no term renders.
          { echo "on_line=$on_line"; echo "on_file=$on_file"; echo "unplaced=$unplaced"; } >> "$GITHUB_OUTPUT"
          echo "findings: $on_line on a line, $on_file on a file, $unplaced in the summary"

      - name: Publish the review check run
        # The half of a review a reader sees without opening it. Named review
        # rather than "AI Review": both systems run during the transition and both
        # post as seidroid[bot], so two checks under one name would be unreadable,
        # where a green AI Review beside a red review is not.
        #
        # Whichever check the driver wrote, decided or not. A run that reached no
        # verdict writes one under the title `no verdict`, naming why, and publishing
        # that is the point of dropping the verdict gate here: with nothing in the
        # checks list, a review that ran and could not be read is indistinguishable
        # from one that never ran, and only one of the two is a reason to look. The
        # file's presence is the gate, so a run that never reached the driver still
        # publishes nothing.
        #
        # That check concludes `failure`, so a repository requiring it holds the merge
        # until a run reads the change. Read the title, not the conclusion, to tell the
        # two apart: a decided review carrying blockers concludes `failure` too.
        #
        # Tolerated while there is a commit to publish against, like the other
        # publish steps: a check run that fails to post must not bury a review that
        # was produced, and the steps below run on !cancelled() and still publish it.
        #
        # Not tolerated when the reviewed commit is missing. head_sha is required and
        # has no default, so that is not a post that failed and may work next time --
        # it is a merge gate that cannot exist, and a green job hides it.
        if: ${{ inputs.mode == 'review' && !cancelled() }}
        continue-on-error: ${{ steps.head.outputs.sha != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.guard.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.head.outputs.sha }}
          CHECK: ${{ steps.drive.outputs.check_path }}
          # The one field this step will not read out of the artifact. See below.
          VERDICT_PRODUCED: ${{ steps.drive.outputs.verdict_produced }}
        run: |
          set -euo pipefail
          if [ ! -s "$CHECK" ]; then
            echo "no check run to publish"
            exit 0
          fi
          # A run that produced no verdict publishes failure, whatever the file says.
          # The file is written by a separate process across a repository boundary, so
          # reading a passing conclusion out of it on a run this workflow already knows
          # produced nothing would let one crash between two writes satisfy a required
          # check. This step decides the one thing that gates a merge; it reads the
          # artifact for everything else.
          conclusion="$(jq -r '.conclusion // empty' "$CHECK" || true)"
          if [ "${VERDICT_PRODUCED:-}" != "true" ]; then
            conclusion="failure"
          fi
          if [ -z "$conclusion" ]; then
            echo "::error::the check file on $REPO#$PR carries no conclusion, so there is nothing to publish as the merge gate"
            exit 1
          fi
          # Against the commit the review read, recorded before it started and used
          # as recorded. A check on any other commit attaches this verdict to code the
          # review never saw, so the head is not read again here.
          #
          # Empty when that record failed. There is no weaker check run to publish in
          # its place, so this says what is missing and fails; the step comment above
          # says why that reaches the job.
          head_sha="${REVIEWED_SHA:-}"
          if [ -z "$head_sha" ]; then
            echo "::error::the reviewed commit was not recorded on $REPO#$PR, so the review check run cannot be published; the verdict comment is the only record of this review"
            exit 1
          fi
          gh api -X POST "repos/$REPO/check-runs" \
            -f name=review \
            -f head_sha="$head_sha" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f output[title]="$(jq -r '.title // "review"' "$CHECK")" \
            -f output[summary]="$(jq -r '.summary // ""' "$CHECK")" >/dev/null
          echo "published review check: $conclusion — $(jq -r '.title // "review"' "$CHECK")"

      - name: State the review's position on the pull request
        # The check run is the gate a merge reads; this is the one a person reads,
        # and the one that shows in the reviewers list. Both come from the same
        # conclusion the driver derived from the findings.
        #
        # Only when there is a position to take. A clean run with approval off, or
        # a run that concluded neutral, adds nothing a reader does not already have
        # from the comment above — and a review cannot be edited later the way that
        # comment is upserted, so an opinionless one is permanent clutter.
        #
        # A review that reached no verdict has no position at all, and verdict_produced
        # is what holds that. It is load-bearing twice over: the withdrawal at the end
        # of this step reads the driver's finding counts, the no-verdict check carries
        # none, and the no-counts branch there proceeds by design. So an ungated
        # no-verdict run would clear a standing block on the strength of a review that
        # produced nothing. The check run and the comment publish without this gate;
        # anything that clears a merge gate keeps it.
        #
        # No continue-on-error, for the withdrawal at the end. That is the only work
        # in this job that clears a merge gate, and a gate left standing on a green
        # run is a block nobody knows to look for. Every other failure here is caught
        # at its own site and stated there, so an unreadable check file, a position
        # the API refuses and a courtesy log line all stay quiet. What reaches the job
        # is the withdrawal.
        #
        # The App records the position where the caller configured one, and the
        # workflow's own identity records it otherwise, so a repository with no App
        # still takes a position and can still clear a block it left before. That
        # identity reads as github-actions[bot], which costs two things a caller has
        # to know: a merge gate that names its reviewers may not count it, and a
        # repository whose Actions policy forbids an approval refuses the event
        # outright. The COMMENT rung below answers the second.
        if: ${{ inputs.mode == 'review' && !cancelled()
          && steps.drive.outputs.verdict_produced == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.guard.outputs.pr_number }}
          REVIEWED_SHA: ${{ steps.head.outputs.sha }}
          CHECK: ${{ steps.drive.outputs.check_path }}
          APPROVE_ON_SUCCESS: ${{ inputs.approve-on-success }}
          # Scopes the withdrawal below to this tool's own blocks. ai-review posts
          # under the same bot identity and marks its reviews differently; its
          # position is not this one's to change.
          #
          # Changing this value strands every blocking review posted under the old one:
          # the withdrawal matches on startswith, so a later clean run approves and
          # retracts nothing, the pull request stays red for a finding that is gone, and
          # only a human can then clear it. Before changing it, confirm no open pull
          # request carries a CHANGES_REQUESTED review whose body starts with the old
          # value.
          MARKER: "<!-- seidroid-review -->"
        run: |
          set -euo pipefail
          if [ ! -s "$CHECK" ]; then
            echo "no conclusion to take a position from"
            exit 0
          fi
          # jq's error goes to the log and the value comes back on stdout, so a check
          # file this step cannot read states itself rather than arriving as data.
          #
          # `// empty` rather than a bare field. A missing conclusion renders as the
          # string "null", and every comparison below takes that for a conclusion.
          conclusion="$(jq -r '.conclusion // empty' "$CHECK" || true)"
          if [ -z "$conclusion" ]; then
            echo "::warning::the check file names no conclusion; no position to take on $REPO#$PR"
            exit 0
          fi

          # The commit the review read, recorded before it started and used as
          # recorded. The head is not read again here, or in any other publisher: one
          # read is the state this whole run publishes against.
          #
          # Empty only when that record failed. commit_id is optional on the reviews
          # API and defaults to the pull request's latest commit, so the position
          # still lands -- the weaker guarantee, stated rather than assumed. This is
          # the one publisher that has a weaker version to fall back to.
          head_sha="${REVIEWED_SHA:-}"
          if [ -z "$head_sha" ]; then
            echo "::warning::the reviewed commit was not recorded; the position goes on the current head of $REPO#$PR, which the review may not have read"
          fi

          event=""
          note=""
          if [ "$conclusion" = "failure" ]; then
            event=REQUEST_CHANGES
            note="review found something blocking. The findings are on the lines they are about, and the summary is in this tool's comment on this pull request."
          elif [ "$conclusion" = "success" ] && [ "$APPROVE_ON_SUCCESS" = "true" ]; then
            event=APPROVE
            note="review found nothing blocking."
          fi

          # commit_id is omitted rather than sent empty when the commit is unknown:
          # the API rejects an empty one, and its own default is the pull request's
          # latest commit, which is the fallback announced above.
          #
          # 0 posted, 2 refused, 1 anything else. Only a refusal earns the rung below:
          # a 403 or a 422 is the API saying this identity may not hold this opinion,
          # and every other failure is one a second call would meet again. That keeps a
          # write that landed and then lost its connection from posting a second review.
          #
          # A 422 also covers a stale commit_id, which the rung retries with the same
          # commit_id and meets identically. That costs one call and no review.
          #
          # The API's own error still reaches stderr, where it says why.
          post_position() {
            local args err rc
            args=(-X POST "repos/$REPO/pulls/$PR/reviews"
                  -f event="$1" -f body="$MARKER"$'\n'"$note")
            if [ -n "$head_sha" ]; then
              args+=(-f commit_id="$head_sha")
            fi
            err="$(gh api "${args[@]}" 2>&1 >/dev/null)" && return 0
            rc=1
            case "$err" in (*"HTTP 403"*|*"HTTP 422"*) rc=2 ;; esac
            printf '%s\n' "$err" >&2
            return "$rc"
          }

          if [ -n "$event" ]; then
            # Guarded, because set -e would abort the step here and take the
            # withdrawal below with it. A 422 on self-approval, a stale commit_id or
            # a transient 5xx must not also cost the pull request its retraction. The
            # API's own error stays on stderr, where it says why.
            #
            # COMMENT is the rung under both events, and the same one ai-review takes.
            # The API refuses an opinion the identity may not hold -- github-actions
            # approving where the repository's Actions policy forbids it, or either
            # identity taking a side on a pull request it opened itself -- and refuses
            # nothing about a review that states its finding without voting. So the
            # reviewers list still carries this run, and the check run still carries
            # the gate. What the rung costs is the vote: an APPROVE that lands here
            # clears no approval requirement, and a REQUEST_CHANGES blocks nothing.
            rc=0
            post_position "$event" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "recorded $event on $REPO#$PR"
            elif [ "$rc" -eq 2 ] && post_position COMMENT; then
              echo "::warning::$REPO#$PR would not take $event, so this review is recorded as a comment; the check run carries the $conclusion conclusion"
            else
              echo "::warning::could not record $event on $REPO#$PR; the verdict comment stands"
            fi
          else
            echo "no position to record for a $conclusion conclusion"
          fi

          # An earlier block this run no longer stands behind. Left standing it
          # keeps a pull request red for a finding that is gone, and only a human
          # can clear it.
          #
          # Withdrawn on the two things this run has to be able to say: it read the
          # change, and it found nothing blocking in it. A failure says the second is
          # false and stands behind its own block.
          if [ "$conclusion" = "failure" ]; then
            exit 0
          fi
          # success says both, because the driver gates it on the line count the review
          # reported. neutral says one word over three states -- a review that could not
          # show it read the diff, a review whose only blocker is already on the base
          # branch, and a review whose findings are all non-blocking. Only the first has
          # no ground to clear another review's finding, and the counts are what separate
          # it: something written down is a review of the change, and nothing written down
          # beside a soft conclusion is a review that did not happen.
          #
          # Read under `counts`, where the driver writes them, with a sentinel for the
          # field it does not: a bare null is a value the arithmetic below would take for
          # a zero, and a driver that reports nothing would then read as a review that
          # found nothing.
          is_count() { case "${1:-}" in (''|*[!0-9]*) return 1 ;; esac; }
          blocking="" non_blocking="" pre_existing="" counted=false
          read -r blocking non_blocking pre_existing < <(jq -r '[(.counts.blocking // "?"),
            (.counts.non_blocking // "?"), (.counts.pre_existing // "?")] | @tsv' \
            "$CHECK" 2>/dev/null) || true
          if is_count "$blocking" && is_count "$non_blocking" && is_count "$pre_existing"; then
            counted=true
          fi

          # A blocking finding beside a conclusion that does not fail is the driver
          # disagreeing with itself, and the comment step states it as that. Here it
          # stops the withdrawal: whichever half is wrong, clearing a merge gate while
          # the review names a blocker is the one outcome that cannot be walked back.
          if [ "$counted" = true ] && [ "$blocking" -gt 0 ]; then
            echo "::warning::the review reports $blocking blocking finding(s) beside a $conclusion conclusion, so it does not clear an earlier block on $REPO#$PR"
            exit 0
          fi
          if [ "$conclusion" != "success" ] && [ "$counted" = true ] \
             && [ $(( blocking + non_blocking + pre_existing )) -eq 0 ]; then
            echo "::notice::a $conclusion review that wrote nothing down does not clear an earlier block on $REPO#$PR"
            exit 0
          fi
          # A driver that writes no counts leaves the three states indistinguishable, and
          # the withdrawal proceeds rather than stopping. Stopping strands the block
          # behind every re-review whose findings are all non-blocking, which that driver
          # also concludes neutral, and which is what most re-reviews find.
          if [ "$conclusion" != "success" ] && [ "$counted" = false ]; then
            echo "::warning::no finding counts beside a $conclusion conclusion on $REPO#$PR, so a review that found only notes reads the same as one that read nothing; the withdrawal proceeds on the conclusion alone. A driver from v0.11.0 writes the counts"
          fi
          # Listed into a variable, and read from it rather than through a pipe. A
          # report written into a pipe the loop reads is not an annotation Actions
          # sees: it is a line the loop takes for a review id, and the dismiss fails
          # on it. Reporting and data have to travel separately.
          #
          # A list this step cannot read is a block it cannot find, which reads the
          # same on the pull request as a block it failed to clear.
          if ! ids="$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                        --jq "[.[] | select(.state == \"CHANGES_REQUESTED\" and ((.body // \"\") | startswith(\"$MARKER\")))] | .[].id")"; then
            echo "::error::could not list the reviews to withdraw on $REPO#$PR; an earlier block may still stand and only a human can clear it"
            exit 1
          fi
          # Every id is tried before the step reports. Exiting inside the loop would
          # leave a block standing that the next call would have cleared, and would
          # name one stuck gate where there are two.
          withdrawn=0
          stuck=0
          while read -r id; do
            [ -n "$id" ] || continue
            if gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
                 -f message="Superseded: the latest review found nothing blocking in this change." \
                 -f event=DISMISS >/dev/null; then
              withdrawn=$((withdrawn+1))
              echo "withdrew review $id"
            else
              stuck=$((stuck+1))
              echo "::error::could not withdraw review $id on $REPO#$PR; it still blocks the merge on a finding this run did not reproduce"
            fi
          done <<< "$ids"
          echo "superseded blocks: $withdrawn withdrawn, $stuck still standing"
          if [ "$stuck" -gt 0 ]; then
            exit 1
          fi

      - name: Answer the request
        # The verdict, on the comment that asked for it, so the person who asked reads
        # the outcome where they asked. The eyes at the top of this job say it started;
        # this step withdraws them and says how it ended.
        #
        # Its own step, and not part of the one that records the position: that step
        # is skipped for a run that reached no verdict, and the person who asked is
        # owed an answer even then. Everything here needs only GITHUB_TOKEN and the
        # job's issues: write.
        #
        # The condition names three facts: a review turn, not cancelled, and a comment
        # to answer. A close produces no verdict, so a request to tear a session down
        # earns no answer.
        # No verdict_produced gate: the acknowledgement waits on this step, and a re-run
        # replays the trigger comment id, so a run reaching no verdict still has to clear
        # the eyes, and a thumb an earlier attempt left there.
        if: ${{ inputs.mode == 'review' && !cancelled()
          && needs.guard.outputs.comment_id != '' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # The repository the request was written on, which is the one the review
          # ran on.
          TRIGGER_REPO: ${{ github.repository }}
          TRIGGER_ID: ${{ needs.guard.outputs.comment_id }}
          CHECK: ${{ steps.drive.outputs.check_path }}
          # Whether there is a verdict to react to. See the conclusion below.
          VERDICT_PRODUCED: ${{ steps.drive.outputs.verdict_produced }}
        run: |
          set -euo pipefail
          # An absent check file reads as an absent conclusion, which the case below
          # answers by clearing. Returning here leaves the eyes standing, and a thumb an
          # earlier attempt left, for a run that reached no verdict.
          #
          # A run that produced no verdict is read as no conclusion, whatever the file
          # holds. It holds `failure` there, and that is the same word a review carrying
          # blockers concludes -- so reading it here would thumb down a run that reviewed
          # nothing, which says the change is bad when nobody could read it. The title
          # separates the two in the checks list; a reaction has no title, so this reads
          # the gate the workflow already computed instead.
          conclusion=""
          if [ -s "$CHECK" ] && [ "${VERDICT_PRODUCED:-}" = "true" ]; then
            # jq's error goes to the log and the value comes back on stdout, so a check
            # file this step cannot read states itself rather than arriving as data.
            conclusion="$(jq -r '.conclusion // empty' "$CHECK" || true)"
          fi

          # On the conclusion, not on the position the step above records: a repository
          # that has not opted into approve-on-success records none for a clean review,
          # and that reader still asked a question.
          #
          # neutral earns nothing, and neither does a conclusion this step cannot read.
          # neutral is what a review concludes when it cannot show it read the diff, and
          # a thumb up there says the change is fine when nobody looked at it.
          #
          # The reaction and the ones it replaces are chosen in one statement, so the
          # two cannot drift apart.
          #
          # Every arm withdraws the eyes. The acknowledgement is a promise of an answer,
          # and this step is where the answer arrives, so the arm that reaches no verdict
          # withdraws them too -- and with them both thumbs. The comment carries what the
          # last run left there, so a run that reaches neither verdict would otherwise
          # leave the request wearing a verdict this run did not reach.
          case "$conclusion" in
            failure) reaction="-1"; stale="+1 eyes" ;;
            success) reaction="+1"; stale="-1 eyes" ;;
            *)
              echo "a ${conclusion:-missing} conclusion earns no reaction; the verdict comment carries what it found"
              reaction=""; stale="+1 -1 eyes" ;;
          esac

          # Withdraw this bot's stale reactions first: the eyes that acknowledged the
          # trigger, and a thumb an earlier attempt left. A reaction is not a toggle and
          # a re-run replays the same comment id, so a comment would otherwise wear a
          # verdict this run did not reach. Scoped to the reacting identity: a human who
          # thumbed the request down is voicing an opinion, and it is not this job's to
          # delete. The same scope leaves a human's eyes alone.
          #
          # GITHUB_TOKEN reacts as github-actions[bot], and an installation token cannot
          # ask the API which login it carries, so the login is named here.
          me="github-actions[bot]"
          # Listed into a variable, and read from it rather than through a pipe, so
          # nothing this block reports can be read back as a reaction id. Paginated,
          # because a busy comment carries more reactions than one page holds and a
          # miss leaves the request wearing the eyes, or a thumb this run replaces.
          if ! mine="$(gh api "repos/$TRIGGER_REPO/issues/comments/$TRIGGER_ID/reactions" \
                         --paginate \
                         --jq ".[] | select(.user.login == \"$me\") | \"\\(.content) \\(.id)\"")"; then
            echo "::warning::could not read the reactions on comment $TRIGGER_ID in $TRIGGER_REPO; the eyes or a stale thumb from this bot may stay on it"
            mine=""
          fi
          while read -r content rid; do
            [ -n "$rid" ] || continue
            case " $stale " in *" $content "*) ;; *) continue ;; esac
            if gh api -X DELETE \
                 "repos/$TRIGGER_REPO/issues/comments/$TRIGGER_ID/reactions/$rid" \
                 >/dev/null; then
              echo "withdrew this bot's $content from comment $TRIGGER_ID"
            else
              echo "::warning::could not withdraw this bot's $content from comment $TRIGGER_ID in $TRIGGER_REPO"
            fi
          done <<< "$mine"

          # Nothing to post when the conclusion earned no reaction: the clearing above is
          # the whole answer there.
          [ -n "$reaction" ] || exit 0

          # Never fatal: a reaction is a courtesy, and losing one must not fail a review
          # that ran and published. Idempotent per identity and content, so a re-run on
          # the same comment returns the reaction already there rather than a second one.
          if gh api -X POST "repos/$TRIGGER_REPO/issues/comments/$TRIGGER_ID/reactions" \
               -f content="$reaction" >/dev/null; then
            echo "reacted $reaction on comment $TRIGGER_ID in $TRIGGER_REPO"
          else
            echo "::warning::could not react on comment $TRIGGER_ID in $TRIGGER_REPO; the review stands"
          fi

      - name: Post the verdict
        # Post only when a real verdict was produced, and even when the drive
        # step above exited non-zero -- `!cancelled()` runs on any outcome
        # except the job itself being cancelled (e.g. superseded by a newer
        # `seidroid review`), which is the one case with nothing to post.
        # Keying on verdict_produced, not the exit code, so a teardown-only
        # failure still posts a valid verdict and a no-verdict run never
        # upserts a placeholder.
        #
        # continue-on-error. This step is the last thing standing between a finished
        # review and the reader, and failing the job here throws that review away
        # rather than saving it. What it costs is the signal, so the run block states
        # the failure itself; see there.
        if: ${{ inputs.mode == 'review' && (!cancelled() && steps.drive.outputs.verdict_produced == 'true') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token || github.token }}
          MARKER: "<!-- seidroid-review -->"
          # The reviewed pull request, which is where a reader looks for a review.
          REPO: ${{ github.repository }}
          PR: ${{ needs.guard.outputs.pr_number }}
          VERDICT: ${{ steps.drive.outputs.verdict_path }}
          # Findings the step above could place nowhere on the diff. Empty when it
          # placed them all.
          NOTE: ${{ steps.place.outputs.note_path }}
          # What the driver counted, for the findings line below. Read rather than
          # recomputed here: the driver derived the check run's conclusion from these
          # same findings, and a second derivation is a second thing that can disagree.
          CHECK: ${{ steps.drive.outputs.check_path }}
          # What the step above placed. Empty, not zero, when that step died partway --
          # and the difference is the point. "0 posted inline" over a placement that
          # never ran is a lie about the review.
          ON_LINE: ${{ steps.place.outputs.on_line }}
          ON_FILE: ${{ steps.place.outputs.on_file }}
          UNPLACED: ${{ steps.place.outputs.unplaced }}
          # The commit the review read, for the failure check below. Recorded before
          # the review started; absent only when that read failed, and then the
          # annotation is the only record.
          REVIEWED_SHA: ${{ steps.head.outputs.sha }}
          # The notice an earlier no-verdict run left, which this verdict supersedes.
          # Its own name: MARKER above is this comment's, and one env block cannot
          # carry two keys of one name.
          NO_VERDICT_MARKER: "<!-- seidroid-review:no-verdict -->"
          # GitHub rejects an issue comment over 65,536 characters. The driver bounds
          # the verdict it writes and clips its own text to fit (review.MaxBodyBytes,
          # 60,000). Nothing bounds $NOTE: it carries Finding.Detail, raw model prose
          # with no length constraint on it. Unbounded, a long tail of unplaced
          # findings pushes the body past the cap and the upsert below is rejected --
          # losing a whole review over its least important part.
          #
          # Bytes, not characters, for the reason the driver counts bytes: a byte count
          # is never lower than a rune count, so a body inside this bound is inside
          # GitHub's limit whichever unit that limit turns out to count.
          MAX_BODY_BYTES: 65536
          # Held back from the note's budget for the truncation notice, which is
          # written after the cut point is chosen and so cannot be measured before it.
          NOTICE_BYTES: 256
        run: |
          set -euo pipefail
          body="$MARKER"$'\n'"$(cat "$VERDICT")"

          # The findings line, in the shape ai-review posts, so a reader moving between
          # the two reviewers during the transition reads one format. Assembled here
          # rather than in the driver because half of it is the placement above, which
          # the driver never sees.
          #
          # It is appended before the note block below, and that ordering is load-bearing
          # twice. It puts the line under the review's prose, where the format wants it.
          # And the note's byte budget measures $body to decide what room is left, so a
          # line added after that measurement is a line nothing accounted for -- and what
          # it pushes past GitHub's cap is the whole review.
          #
          # Every term is dropped rather than guessed, and nothing here can fail the
          # publish. A count this run cannot read costs the term; a line with no count
          # left in it is not written at all.
          is_count() { case "${1:-}" in (''|*[!0-9]*) return 1 ;; esac; }
          line="" counted=false
          add_term() { if [ -n "$line" ]; then line="$line | "; fi; line="$line$1"; }

          # The driver's own totals, over every finding the review reported rather than
          # over the ones that could be placed: a blocker naming no line is still a
          # blocker, and a count that omitted it would read as a cleaner review than the
          # one that ran.
          #
          # A driver older than these fields writes none of them and jq answers null. The
          # sentinel makes that a value is_count rejects, so an old driver publishes the
          # same comment with a shorter line that is still true.
          # Under `counts`, which is where the driver writes them: check.json carries
          # `counts: {blocking, non_blocking, placeable, pre_existing}` beside a
          # top-level `conclusion`. Read at the ROOT they answered null on every run, so
          # the line never printed a number, the notice below claimed the driver predates
          # fields it has, and neither disagreement warning could fire -- the one automated
          # cross-check between this comment and the check run was dead code.
          blocking="" non_blocking="" pre_existing="" conclusion=""
          if [ -s "${CHECK:-}" ]; then
            read -r blocking non_blocking pre_existing conclusion < <(jq -r '[(.counts.blocking // "?"),
              (.counts.non_blocking // "?"), (.counts.pre_existing // "?"), (.conclusion // "?")] | @tsv' \
              "$CHECK" 2>/dev/null) || true
          fi
          if is_count "$blocking" && is_count "$non_blocking"; then
            add_term "$blocking blocking"
            add_term "$non_blocking non-blocking"
            counted=true
          else
            echo "::notice::this driver reports no finding counts, so the findings line \
              omits them; it predates check.json's blocking and non_blocking fields"
          fi

          # Both placements the step above makes: on a line where the diff carries it, on
          # the file where it does not. Both land in the pull request's file view, which
          # is what "inline" means to the person reading it. What reached neither is not
          # counted here -- the note below names those one by one under a heading of their
          # own, which is more than a number would say.
          if is_count "${ON_LINE:-}" && is_count "${ON_FILE:-}" && is_count "${UNPLACED:-}"; then
            add_term "$(( ON_LINE + ON_FILE )) posted inline"
            counted=true
          else
            add_term "inline placement did not run"
            echo "::notice::no placement counts, so the findings line says so; that step \
              writes none of them if it dies partway"
          fi

          # Counted apart from both, and named. CheckConclusion excludes a pre-existing
          # blocker from the gate on purpose -- it is already on the base branch, so
          # failing on it would fail every pull request that touches the file, and the
          # author who has to clear the check is the one person who did not cause it.
          # Folded into "blocking" it would print a number the check run contradicts;
          # folded into "non-blocking" it would tell an author their change has problems
          # it does not have. Omitted at zero, which is most reviews.
          if is_count "$pre_existing" && [ "$pre_existing" -gt 0 ]; then
            add_term "$pre_existing pre-existing"
          fi

          # Two numbers about one review must not disagree. Both are the driver's, from
          # the same findings, so a disagreement is a defect there rather than a case to
          # render around. It is stated in the log and the line still prints what it was
          # given: correcting either number here would publish a third answer and hide
          # the bug that produced the first two.
          if is_count "$blocking" && [ "$conclusion" = "failure" ] && [ "$blocking" -eq 0 ]; then
            echo "::warning::the driver reported 0 blocking findings beside a failing \
              check; this comment and the check run disagree"
          elif is_count "$blocking" && [ "$conclusion" != "failure" ] && [ "$blocking" -gt 0 ]; then
            echo "::warning::the driver reported $blocking blocking finding(s) beside a \
              $conclusion check; this comment and the check run disagree"
          fi

          if [ "$counted" = true ]; then
            body="$body"$'\n\n'"**Findings:** $line"
          fi

          # A reader who sees no inline comment for an observation would otherwise
          # have to guess whether it was dropped.
          #
          # Bounded against what the marker and the verdict already spend, so the note
          # can never be the thing that pushes the comment past GitHub's cap. Cut on
          # whole lines: a byte cut can land inside a UTF-8 sequence or inside a
          # finding's markdown, where a line cut can be counted and named.
          if [ -n "$NOTE" ] && [ -s "$NOTE" ]; then
            room=$(( MAX_BODY_BYTES - $(printf '%s\n\n' "$body" | wc -c) ))
            if [ "$(wc -c < "$NOTE")" -le "$room" ]; then
              body="$body"$'\n\n'"$(cat "$NOTE")"
            else
              # Every line the place step writes for a finding opens with "- `".
              total="$(grep -c '^- `' "$NOTE" || true)"
              budget=$(( room - NOTICE_BYTES ))
              kept=""
              shown=0
              if [ "$budget" -gt 0 ]; then
                # sed drops the last line, which is the one the byte cut may have left
                # half-written.
                kept="$(head -c "$budget" "$NOTE" | sed '$d')"
                shown="$(printf '%s\n' "$kept" | grep -c '^- `' || true)"
              fi
              if [ "$shown" -gt 0 ]; then
                body="$body"$'\n\n'"$kept"
              fi
              body="$body"$'\n\n'"_Cut to stay inside GitHub's comment limit ($MAX_BODY_BYTES bytes): $shown of $total observation(s) are shown here. All $total are in this workflow run's log._"
              echo "::warning::the summary note was cut to $shown of $total unplaced observation(s) to fit GitHub's comment limit; the full list follows"
              cat "$NOTE"
            fi
          fi
          # A NEW comment every iteration, never an edit of the last one. Editing leaves
          # the comment at its ORIGINAL position in the thread and notifies nobody, so a
          # re-review became close to invisible: it did not move, it did not notify, and
          # it destroyed the previous verdict's text. A verdict written four minutes ago
          # rendered eighteen hours up the page, indistinguishable from a review that
          # never ran, and that cost real diagnosis time.
          #
          # Earlier verdicts are left standing on purpose. They are the record of what the
          # review said before the author's fixes, which is the thing a reader compares
          # against. A long pull request accumulates a few, which is the accepted cost.
          #
          # It also removes a hazard the marker lookup carried: this marker is shared with
          # the unplaced-findings note posted above, so selecting `.[0]` by marker could
          # overwrite that note rather than the previous verdict.
          #
          # repo/pr from env, not template-interpolated into the script. The failure is
          # caught rather than left to `set -e`, so this step can say what was lost.
          posted=false
          if gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null; then
            posted=true
          fi
          if [ "$posted" = true ]; then
            echo "posted the verdict on $REPO#$PR"
            # An earlier run may have left a notice saying this review did not complete.
            # It did, so that notice now asserts a state that is not true and links a run
            # that is not the latest. The check run supersedes itself on the new commit;
            # a comment does not, so this withdraws it.
            #
            # Matched on the marker at the start of the body, and only on this tool's own
            # comments, so a person quoting the marker cannot have their comment deleted.
            # The listing emits one id per line: --paginate runs the filter once per page,
            # so aggregating inside jq would emit one result per page and concatenate them
            # into a string no comment carries.
            #
            # Every failure here is tolerated. The verdict is posted, and a stale notice
            # beside it is a smaller cost than failing a step that already did its work.
            # shellcheck disable=SC2016  # $ENV is jq's, and single quotes are what keep it jq's
            stale_notice="$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq '.[] | select(.user.type == "Bot") | select(.body | startswith($ENV.NO_VERDICT_MARKER)) | .id' \
              2>/dev/null | tail -n 1 || true)"
            if [ -n "$stale_notice" ]; then
              if gh api -X DELETE "repos/$REPO/issues/comments/$stale_notice" >/dev/null 2>&1; then
                echo "withdrew the no-verdict notice an earlier run left on $REPO#$PR"
              else
                echo "::warning::could not withdraw the no-verdict notice $stale_notice on $REPO#$PR; it now says this review did not complete, and it did"
              fi
            fi
            exit 0
          fi

          # continue-on-error above is what stops a publishing failure from discarding a
          # review that ran. It also removes the only signal there was, and a review that
          # is silently absent is worse than a red job. So the failure is stated in two
          # places, because neither alone is enough: an annotation on the run, which needs
          # nothing but the runner; and the check run, which is the only one of the two
          # that reaches the pull request, where the reader is waiting for a review that
          # is not coming.
          #
          # The verdict goes to the log unposted, so the run still holds what the review
          # cost model spend and a sandbox to produce.
          bytes="$(printf '%s' "$body" | wc -c | tr -d '[:space:]')"
          echo "::error::the review reached a verdict but it could not be posted on $REPO#$PR ($bytes bytes); it is in this step's log below"
          echo "--- verdict, unposted ---"
          printf '%s\n' "$body"
          echo "--- end verdict ---"
          # Under the same name as the check published above, so it supersedes that
          # conclusion on this commit rather than sitting beside it, and so a later run
          # that does post clears it. Best-effort: whatever stopped the comment can stop
          # this too, and then the annotation stands alone.
          if [ -n "${REVIEWED_SHA:-}" ]; then
            gh api -X POST "repos/$REPO/check-runs" \
              -f name=review \
              -f head_sha="$REVIEWED_SHA" \
              -f status=completed \
              -f conclusion=failure \
              -f output[title]="review produced but not published" \
              -f output[summary]="The review ran and reached a verdict. Posting it to this pull request failed, so the verdict is not here. Read it in the workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >/dev/null \
              || echo "::warning::the failure check run could not be posted either; the annotation on this run is the only record"
          else
            echo "::warning::no reviewed commit was recorded, so there is no check run to fail; the annotation on this run is the only record"
          fi

      - name: Report a review that reached no verdict
        # The step above answers a review that decided; this one answers a review that
        # could not be read. A person who asked would otherwise get a red job, an
        # untouched pull request, and one line in a log nobody opens. ai-review.yml
        # answers the same case the same way, and this is parity with it.
        #
        # The complement of the step above, on one output: `== 'true'` there, `!= 'true'`
        # here. So a review run that was not cancelled posts one comment or the other,
        # never both and never neither -- including a run that died before the driver,
        # where verdict_produced is unset and this is the only record left.
        #
        # It reports and takes no position. No approval, no request for changes, and no
        # withdrawal of an earlier block: the step above owns all three, and it keeps
        # the verdict gate for that reason.
        #
        # No byte-cap arithmetic, unlike the step above. What it appends is a bounded
        # summary the driver clipped, not the unbounded findings note.
        #
        # continue-on-error, like its sibling. The drive step already failed the job on
        # this path -- it forces a non-zero exit when a review produced no verdict -- so
        # failing it again here buys no signal; the annotation in the run block is what
        # replaces the one it costs.
        if: ${{ inputs.mode == 'review' && !cancelled()
          && steps.drive.outputs.verdict_produced != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token || github.token }}
          # Its own marker, following the same shape the inline findings use. The
          # verdict comment's marker means "this tool's verdict"; this comment reports
          # that there is none, so a later step or a reader's query can address one
          # without matching the other. This step reads it back to find its own notice.
          MARKER: "<!-- seidroid-review:no-verdict -->"
          # Where the verdict comment would have gone.
          REPO: ${{ github.repository }}
          PR: ${{ needs.guard.outputs.pr_number }}
          # Why there is no verdict, in the driver's own words. Absent when the run
          # never reached the driver, and the body says which of the two happened.
          CHECK: ${{ steps.drive.outputs.check_path }}
        run: |
          set -euo pipefail
          # Removes the standing no-verdict notice, if there is one, so exactly one is
          # ever on the pull request.
          #
          # Matched on the marker at the start of the body, and only on this tool's own
          # comments, so a person quoting the marker cannot have their comment deleted.
          # The listing emits one id per line: --paginate runs the filter once per page,
          # so aggregating inside jq would emit one result per page and concatenate them
          # into a string no comment carries.
          #
          # Every failure here is tolerated. Whichever caller runs this has something
          # else to say afterwards, and a stale notice is a smaller cost than losing it.
          delete_prior_notice() {
            local id
            # shellcheck disable=SC2016  # $ENV is jq's, and single quotes are what keep it jq's
            id="$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
              --jq '.[] | select(.user.type == "Bot") | select(.body | startswith($ENV.MARKER)) | .id' \
              2>/dev/null | tail -n 1 || true)"
            if [ -n "$id" ]; then
              if gh api -X DELETE "repos/$REPO/issues/comments/$id" >/dev/null 2>&1; then
                echo "withdrew the standing no-verdict notice on $REPO#$PR"
              else
                echo "::warning::could not withdraw the no-verdict notice $id on $REPO#$PR"
              fi
            fi
          }

          # The check run's own summary, not a second account of the same run. That
          # check is published above and a reader compares the two; one string is what
          # keeps them from disagreeing. jq's error goes to the log and the value comes
          # back empty, so a check file this step cannot read falls to the case below.
          reason=""
          if [ -s "${CHECK:-}" ]; then
            reason="$(jq -r '.summary // empty' "$CHECK" 2>/dev/null || true)"
          fi
          # Two different runs reach this. One reviewed and could not be read, and the
          # driver said why. The other never got as far as the driver -- a failed
          # install, a toolchain that would not resolve -- and has no reason to give, so
          # this says that rather than implying the review ran.
          started=true
          if [ -z "$reason" ]; then
            reason="This run recorded no reason, which happens when it stopped before the review started."
            started=false
          fi
          body="$(printf '%s\n%s\n\n%s\n\n%s\n' \
            "$MARKER" \
            '**This review did not complete.** It reached no verdict, so there is no review of this change to act on.' \
            "$reason" \
            "Read this run for the rest: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          # One notice per pull request: the previous one is deleted and a new one is
          # posted. The verdict comment accumulates on purpose -- an author compares
          # this review against the last one -- but a notice that the review did not
          # complete carries no such history, and an outage on a caller wired to every
          # push would leave one identical copy per push.
          #
          # Deleted and reposted rather than edited, for the reason `Post the verdict`
          # states about itself: an edit stays where it was in the thread and notifies
          # nobody, so a second consecutive failure would reach the person who just
          # asked as nothing at all. Posting lands it at the bottom, carrying this run's
          # url.
          #
          # A deletion that fails costs a duplicate notice; the post below runs either
          # way, so the person who asked always gets an answer.
          delete_prior_notice
          if gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null; then
            echo "reported a no-verdict review on $REPO#$PR"
            exit 0
          fi
          # The last record standing. continue-on-error above keeps a failed comment
          # from adding a second failure to a job the drive step already failed, and it
          # also removes the only signal there was -- so the report goes to the log
          # where the run still holds it.
          if [ "$started" = true ]; then
            echo "::error::the review reached no verdict, and that could not be reported on $REPO#$PR; this run's log is the only record"
          else
            echo "::error::this run stopped before the review started, and that could not be reported on $REPO#$PR; this run's log is the only record"
          fi
          echo "--- report, unposted ---"
          printf '%s\n' "$body"
          echo "--- end report ---"
